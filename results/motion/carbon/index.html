      fg.translate(-(cx + cardW * 0.5), -(cardY + cardH * 0.5));

      // Crisp Neo-Swiss offset shadow + card body
      roundRectPath(fg, cx + 5, cardY + 5, cardW, cardH, 16);
      fg.fillStyle = PAL.ink;
      fg.fill();

      roundRectPath(fg, cx, cardY, cardW, cardH, 16);
      fg.fillStyle = PAL.cream;
      fg.fill();
      fg.lineWidth = 2;
      fg.strokeStyle = PAL.ink;
      fg.stroke();

      // Number badge
      fg.fillStyle = cd.accent === PAL.mint ? PAL.ink : PAL.ivory;
      roundRectPath(fg, cx + 18, cardY + 18, 42, 26, 8);
      fg.fillStyle = cd.accent;
      fg.fill();
      fg.fillStyle = cd.accent === PAL.mint ? PAL.ink : PAL.ivory;
      fg.font = `700 12px ${FONT_MONO}`;
      fg.textBaseline = 'middle';
      drawTracked(fg, cd.num, cx + 39, cardY + 31, 0.5, 'center');

      // Card text
      fg.fillStyle = PAL.ink;
      fg.font = `800 22px ${FONT_DISPLAY}`;
      drawTracked(fg, cd.title, cx + 20, cardY + 66, -0.3, 'left');
      fg.fillStyle = PAL.slate;
      fg.font = `500 13px ${FONT_MONO}`;
      drawTracked(fg, cd.sub, cx + 20, cardY + 91, 0.2, 'left');

      // Living micro-icon on right side of each card!
      const ix = cx + cardW - 44, iy = cardY + 56;
      if (idx === 0) {
        const kw = 12 + Math.sin(t * 4) * 6;
        fg.fillStyle = PAL.vermilion;
        fg.fillRect(ix - kw, iy - 12, 5, 24);
        fg.fillRect(ix + kw - 5, iy - 12, 5, 24);
        fg.fillRect(ix - kw, iy - 2, kw * 2, 4);
      } else if (idx === 1) {
        const by = Math.abs(Math.sin(t * 4.5)) * 22;
        fg.beginPath(); fg.arc(ix, iy + 10 - by, 9, 0, TAU);
        fg.fillStyle = PAL.cobalt; fg.fill();
      } else if (idx === 2) {
        drawOctahedron2D(fg, ix, iy, 22, t * 1.4, PAL.vermilion, PAL.cobalt);
      } else {
        fg.strokeStyle = PAL.ink; fg.lineWidth = 2.2;
        fg.beginPath();
        for (let k = -16; k <= 16; k += 2) {
          const wy = iy + Math.sin(k * 0.35 + t * 6) * 10;
          if (k === -16) fg.moveTo(ix + k, wy); else fg.lineTo(ix + k, wy);
        }
        fg.stroke();
      }
      fg.restore();
    });

    // Footer Metadata + Living Rotating Circular Seal!
    if (b > 29.0) {
      const fp = E.expoOut(remap(b, 29.0, 29.9, 0, 1));
      fg.save();
      fg.globalAlpha = fp;
      fg.fillStyle = PAL.ink;
      fg.font = `600 13px ${FONT_MONO}`;
      fg.textBaseline = 'middle';
      drawTracked(fg, '100% PROCEDURAL REAL-TIME RENDER  ·  SELF-CONTAINED HTML5 / WEBGL2 / WEBAUDIO', 112, 930, 0.9, 'left');
      drawCircularStamp(fg, 1742, 868, 56, 'AVAILABLE FOR DIRECTION • 2026 • ', t * 0.65, PAL.ink);
      drawStarburst(fg, 1742, 868, 16, 6, 4, -t * 0.9, PAL.vermilion);
      fg.restore();
    }

    fg.restore();

    return {
      mode: 3, cx: 960, cy: gemY, time: t, beat: b,
      camDist: 3.8, objScale: 0.33
    };
  }

  /* =========================================================================
   * 6. MASTER TIMELINE, STAGE SCALING & INTERACTIVE STUDIO HUD
   * ========================================================================= */
  const bgCanvas = document.getElementById('bgCanvas');
  const glCanvas = document.getElementById('glCanvas');
  const fgCanvas = document.getElementById('fgCanvas');
  const bgCtx = bgCanvas.getContext('2d');
  const fgCtx = fgCanvas.getContext('2d');
  const shaderStage = new ShaderStage(glCanvas);

  const stage = { w: window.innerWidth, h: window.innerHeight, dpr: 1, scale: 1 };

  function resize() {
    stage.w = window.innerWidth;
    stage.h = window.innerHeight;
    stage.dpr = Math.min(window.devicePixelRatio || 1, 2);
    stage.scale = Math.min(stage.w / VW, stage.h / VH);

    [bgCanvas, fgCanvas].forEach(c => {
      c.width = Math.round(stage.w * stage.dpr);
      c.height = Math.round(stage.h * stage.dpr);
    });
    shaderStage.resize(stage.w, stage.h, stage.dpr);
  }
  window.addEventListener('resize', resize);
  resize();

  // Optional URL query params (?t=5.2&pause=1) for frame-exact inspection
  const params = new URLSearchParams(window.location.search);
  let currentTime = params.has('t') ? clamp(parseFloat(params.get('t')) || 0, 0, DURATION) : 0;
  let playing = params.get('pause') !== '1';
  let lastNow = performance.now();

  // HUD Elements
  const hud = document.getElementById('hud');
  const playBtn = document.getElementById('playBtn');
  const replayBtn = document.getElementById('replayBtn');
  const soundBtn = document.getElementById('soundBtn');
  const scrubWrap = document.getElementById('scrubWrap');
  const scrubFill = document.getElementById('scrubFill');
  const timeReadout = document.getElementById('timeReadout');
  let hudTimer = null;

  function revealHud() {
    hud.classList.add('visible');
    clearTimeout(hudTimer);
    hudTimer = setTimeout(() => {
      if (playing && !scrubbing) hud.classList.remove('visible');
    }, 2400);
  }

  function syncHudButtons() {
    playBtn.textContent = playing ? 'PAUSE' : 'PLAY';
    soundBtn.textContent = score.enabled ? '♪ SOUND ON' : '♪ SOUND OFF';
    soundBtn.classList.toggle('active', score.enabled);
  }

  function restartReel() {
    currentTime = 0;
    score.lastStep = -1;
    playing = true;
    lastNow = performance.now();
    syncHudButtons();
  }

  window.addEventListener('pointermove', revealHud, { passive: true });

  // Clicking stage unlocks sound on first gesture, then toggles play/pause or replays if finished
  document.getElementById('stage').addEventListener('pointerdown', () => {
    revealHud();
    if (!score.enabled) {
      score.toggle(true);
      syncHudButtons();
      if (currentTime >= DURATION) restartReel();
      return;
    }
    if (currentTime >= DURATION) restartReel();
    else {
      playing = !playing;
      lastNow = performance.now();
      syncHudButtons();
    }
  });

  playBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (currentTime >= DURATION) restartReel();
    else {
      playing = !playing;
      lastNow = performance.now();
      syncHudButtons();
    }
  });

  replayBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (!score.enabled) score.toggle(true);
    restartReel();
  });

  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    score.toggle();
    syncHudButtons();
  });

  let scrubbing = false;
  const scrubAt = (clientX) => {
    const rect = scrubWrap.getBoundingClientRect();
    const u = clamp((clientX - rect.left) / rect.width, 0, 1);
    currentTime = u * DURATION;
    score.lastStep = -1;
  };
  scrubWrap.addEventListener('pointerdown', (e) => {
    e.stopPropagation();
    scrubbing = true;
    scrubWrap.setPointerCapture(e.pointerId);
    scrubAt(e.clientX);
  });
  scrubWrap.addEventListener('pointermove', (e) => { if (scrubbing) scrubAt(e.clientX); });
  scrubWrap.addEventListener('pointerup', () => { scrubbing = false; lastNow = performance.now(); });

  window.addEventListener('keydown', (e) => {
    revealHud();
    if (e.code === 'Space') {
      e.preventDefault();
      if (currentTime >= DURATION) restartReel();
      else { playing = !playing; lastNow = performance.now(); syncHudButtons(); }
    } else if (e.code === 'KeyR') {
      restartReel();
    } else if (e.code === 'KeyM') {
      score.toggle();
      syncHudButtons();
    } else if (e.code === 'ArrowLeft') {
      currentTime = clamp(currentTime - 0.25, 0, DURATION);
    } else if (e.code === 'ArrowRight') {
      currentTime = clamp(currentTime + 0.25, 0, DURATION);
    }
  });

  // Expose deterministic time hook for external inspection / tooling if needed
  window.__setReelTime = (sec) => {
    currentTime = clamp(sec, 0, DURATION);
    playing = false;
  };

  function applyVirtualStage(ctx) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, stage.w * stage.dpr, stage.h * stage.dpr);
    const s = stage.scale * stage.dpr;
    const ox = stage.w * stage.dpr * 0.5 - VW * 0.5 * s;
    const oy = stage.h * stage.dpr * 0.5 - VH * 0.5 * s;
    ctx.setTransform(s, 0, 0, s, ox, oy);
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - lastNow) / 1000));
    lastNow = now;

    if (playing && !scrubbing) {
      currentTime += dt;
      if (currentTime >= DURATION + END_HOLD) {
        currentTime = 0;
        score.lastStep = -1;
      }
    }

    const displayTime = Math.min(DURATION, currentTime);
    const beat = currentTime * (BPM / 60); // Continues gently past 32.0 during END_HOLD so 3D gem stays alive!

    score.update(currentTime, playing && !scrubbing);

    // Update HUD timeline
    scrubFill.style.width = `${(displayTime / DURATION) * 100}%`;
    timeReadout.textContent = `${displayTime.toFixed(2).padStart(5, '0')} / 15.00s`;

    // Render 3-Layer Stack
    applyVirtualStage(bgCtx);
    applyVirtualStage(fgCtx);

    let glParams = null;
    if (beat < 4.0) {
      renderAct1(bgCtx, fgCtx, currentTime, beat, stage);
    } else if (beat < 9.0) {
      renderAct2(bgCtx, fgCtx, currentTime, beat, stage);
    } else if (beat < 16.0) {
      glParams = renderAct3(bgCtx, fgCtx, currentTime, beat, stage);
    } else if (beat < 22.0) {
      renderAct4(bgCtx, fgCtx, currentTime, beat, stage);
    } else if (beat < 27.5) {
      glParams = renderAct5(bgCtx, fgCtx, currentTime, beat, stage);
    } else {
      glParams = renderAct6(bgCtx, fgCtx, currentTime, beat, stage);
    }

    shaderStage.render(glParams, stage.scale, fgCtx);

    // Subtle cinema timeline progress hairline along very bottom edge of viewport
    fgCtx.save();
    fgCtx.setTransform(stage.dpr, 0, 0, stage.dpr, 0, 0);
    fgCtx.fillStyle = beat >= 27.5 || beat < 4.0 ? PAL.vermilion : PAL.acid;
    fgCtx.fillRect(0, stage.h - 2.5, stage.w * (displayTime / DURATION), 2.5);
    fgCtx.restore();

    requestAnimationFrame(frame);
  }

  syncHudButtons();
  requestAnimationFrame((now) => {
    lastNow = now;
    frame(now);
  });
})();
</script>
</body>
</html>
