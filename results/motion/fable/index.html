<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Claude — Motion Reel 2026</title>
<style>
  html,body{margin:0;height:100%;background:#050506;overflow:hidden}
  #stage{position:fixed;inset:0;display:grid;place-items:center;cursor:pointer}
  canvas{display:block;background:#0d0d10}
  #hint{position:fixed;left:50%;top:18px;transform:translateX(-50%);
    font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;
    color:#f3eee3;background:rgba(13,13,16,.72);border:1px solid rgba(243,238,227,.28);
    padding:9px 14px 9px 12px;border-radius:999px;cursor:pointer;white-space:nowrap;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .6s;user-select:none}
  #hint i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#ff4a1c;margin-right:9px;
    animation:bl .9375s steps(2,jump-none) infinite}
  #hint.off{opacity:0;pointer-events:none}
  @keyframes bl{from{opacity:1}to{opacity:.25}}
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="hint"><i></i><span>CLICK FOR SOUND · SPACE TO PAUSE</span></div>
<script>
(() => {
'use strict';

/* ───────────────────────── constants ───────────────────────── */
const W = 1920, H = 1080, DUR = 15, BPM = 128, BEAT = 60 / BPM, BAR = BEAT * 4;
const B = n => n * BEAT;
const PI = Math.PI, TAU = PI * 2;
const INK = '#0d0d10', PAPER = '#f3eee3', ORANGE = '#ff4a1c', BLUE = '#2a3cff', LIME = '#c9f73a', PINK = '#ff9ad5';

const cl = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const pr = (t, start, dur) => cl((t - start) / dur);
const mod = (a, n) => ((a % n) + n) % n;
const pad2 = n => (n < 10 ? '0' : '') + n;

const E = {
  inCubic: x => x * x * x,
  outCubic: x => 1 - Math.pow(1 - x, 3),
  inOutCubic: x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2,
  inQuart: x => x * x * x * x,
  inQuint: x => x * x * x * x * x,
  inExpo: x => x <= 0 ? 0 : Math.pow(2, 10 * x - 10),
  outExpo: x => x >= 1 ? 1 : 1 - Math.pow(2, -10 * x),
  outBack: (x, s = 1.70158) => 1 + (s + 1) * Math.pow(x - 1, 3) + s * Math.pow(x - 1, 2),
  spring: x => 1 - Math.exp(-6.5 * x) * Math.cos(13 * x),
};
const invInOutCubic = y => y < .5 ? Math.cbrt(y / 4) : 1 - Math.cbrt((1 - y) / 4);

function rng(seed) {
  let a = seed >>> 0;
  return () => {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* ───────────────────────── canvas ───────────────────────── */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d', { alpha: false });
const mctx = document.createElement('canvas').getContext('2d');
let SC = 1;
function resize() {
  const ww = innerWidth, wh = innerHeight;
  let cw = ww, ch = ww * 9 / 16;
  if (ch > wh) { ch = wh; cw = wh * 16 / 9; }
  const dpr = Math.min(window.devicePixelRatio || 1, 2, 2560 / cw);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.width = Math.max(2, Math.round(cw * dpr)); cv.height = Math.max(2, Math.round(ch * dpr));
  SC = cv.width / W;
}
addEventListener('resize', () => { resize(); if (frozen != null || !playing) render(curT()); });

/* ───────────────────────── type ───────────────────────── */
const SANS = 'system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif';
const MONO = 'ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace';
const SERIF = '"Didot","Bodoni 72","Bodoni MT","Playfair Display",Georgia,"Times New Roman",serif';
const fSans = (s, w = 900) => `${w} ${s}px ${SANS}`;
const LS = 'letterSpacing' in ctx;
mctx.font = fSans(100);
const CAP = (mctx.measureText('H').actualBoundingBoxAscent || 72) / 100;

const _lc = new Map();
function baseLayout(str, weight) {
  const k = weight + '|' + str;
  let L = _lc.get(k);
  if (!L) {
    mctx.font = fSans(100, weight);
    const xs = [], ws = [];
    for (let i = 0; i < str.length; i++) {
      xs.push(mctx.measureText(str.slice(0, i)).width);
      ws.push(mctx.measureText(str[i]).width);
    }
    L = { xs, ws, w: mctx.measureText(str).width };
    _lc.set(k, L);
  }
  return L;
}
function word(str, size, weight = 900) {
  const L = baseLayout(str, weight), s = size / 100;
  return { xs: L.xs.map(x => x * s), ws: L.ws.map(w => w * s), w: L.w * s };
}
const fitSize = (str, width, weight = 900) => 100 * width / baseLayout(str, weight).w;

function monoText(str, x, y, size, o = {}) {
  ctx.font = `${o.w || 500} ${size}px ${MONO}`;
  ctx.textAlign = o.align || 'left'; ctx.textBaseline = 'alphabetic';
  if (LS) ctx.letterSpacing = (o.ls != null ? o.ls : size * .12) + 'px';
  if (o.color) ctx.fillStyle = o.color;
  const ga = ctx.globalAlpha;
  if (o.alpha != null) ctx.globalAlpha = ga * o.alpha;
  ctx.fillText(str, x, y);
  ctx.globalAlpha = ga;
  if (LS) ctx.letterSpacing = '0px';
}
const typeOn = (str, p) => str.slice(0, Math.round(str.length * cl(p)));

/* per-letter masked rise: the workhorse title reveal */
function riseWord(str, x, base, size, t, o) {
  const L = word(str, size, o.weight || 900), cap = CAP * size;
  const x0 = o.align === 'c' ? x - L.w / 2 : o.align === 'r' ? x - L.w : x;
  const n = str.length;
  ctx.save();
  ctx.beginPath();
  ctx.rect(x0 - size, base - cap - size * .04, L.w + size * 2, cap + size * .07);
  ctx.clip();
  ctx.font = fSans(size, o.weight || 900);
  ctx.fillStyle = o.color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  for (let i = 0; i < n; i++) {
    const k = o.rev ? n - 1 - i : i;
    const pin = E.outExpo(pr(t, o.tin + k * (o.stag != null ? o.stag : .03), o.din || .4));
    const pout = o.tout != null ? E.inCubic(pr(t, o.tout + k * (o.stagOut != null ? o.stagOut : .015), o.dout || .15)) : 0;
    if (pin <= 0 || pout >= 1) continue;
    const y = base + (1 - pin) * cap * 1.2 + pout * cap * 1.2 * (o.outDir || 1);
    ctx.fillText(str[i], x0 + L.xs[i], y);
  }
  ctx.restore();
  return { x0, w: L.w, cap };
}

/* ───────────────────────── helpers ───────────────────────── */
function bg(c) { ctx.fillStyle = c; ctx.fillRect(-120, -120, W + 240, H + 240); }
function disc(x, y, r) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fill(); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}

/* ═════════════════════ 00 · INTRO — the bouncing ball ═════════════════════ */
const G1 = 716, R1 = 54, T1 = B(1), T2 = B(2), T3 = B(3);
function ballY(t) {
  const top = G1 - R1;
  if (t < T1) { const u = Math.max(0, t) / T1; return lerp(-150, top, u * u); }
  if (t < T2) { const u = (t - T1) / BEAT; return top - 430 * 4 * u * (1 - u); }
  if (t < T3) { const u = (t - T2) / BEAT; return top - 250 * 4 * u * (1 - u); }
  return lerp(top, 540, E.outCubic(pr(t, T3, .34)));
}
function ball(t) {
  const y = ballY(t), v = (ballY(t + .004) - ballY(t - .004)) / .008;
  let last = -1;
  if (t >= T1) last = T1; if (t >= T2) last = T2; if (t >= T3) last = T3;
  const sq = last < 0 ? 0 : .42 * Math.exp(-(t - last) / .045);
  const st = cl(Math.abs(v) / 5200, 0, .3);
  const sy = 1 + st - sq;
  return { y: y + R1 * sq, sy, sx: 1 / sy };
}
function s1(t) {
  bg(INK);
  const out = pr(t, B(3.45), .2);
  // registration dots
  const ga = E.outCubic(pr(t, 0, .7)) * (1 - out);
  if (ga > 0) {
    ctx.fillStyle = PAPER;
    for (let y = 60; y < H; y += 80) for (let x = 40; x < W; x += 80) {
      const d = Math.hypot(x - 960, y - G1) / 1300;
      ctx.globalAlpha = .13 * ga * cl((t - d * .5) / .3);
      ctx.fillRect(x - 1.5, y - 1.5, 3, 3);
    }
    ctx.globalAlpha = 1;
  }
  // floor glow
  const by = ballY(t), hgt = cl((G1 - R1 - by) / 460);
  if (t < T3 + .15) {
    ctx.save(); ctx.translate(960, G1); ctx.scale(1, .16);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 330);
    g.addColorStop(0, `rgba(255,74,28,${(.34 * (1 - hgt) * (1 - pr(t, T3, .15))).toFixed(3)})`);
    g.addColorStop(1, 'rgba(255,74,28,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, 330, 0, TAU); ctx.fill();
    ctx.restore();
  }
  // words rise out of the floor
  riseWord('MOTION', 960 - 118, G1 - 20, 150, t, { align: 'r', rev: true, tin: T1 + .02, stag: .028, din: .42, tout: T3, dout: .2, stagOut: .016, color: PAPER });
  riseWord('REEL', 960 + 118, G1 - 20, 150, t, { tin: T2 + .02, stag: .028, din: .42, tout: T3, dout: .2, stagOut: .016, color: PAPER });
  // the floor line, with a damped wave from every impact
  const L = 720 * E.outExpo(pr(t, T1, .5)) * (1 - E.inCubic(pr(t, T3 + .02, .22)));
  if (L > 1) {
    ctx.strokeStyle = PAPER; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath();
    const n = Math.ceil(2 * L / 10);
    for (let i = 0; i <= n; i++) {
      const x = -L + 2 * L * i / n, d = Math.abs(x);
      let y = 0;
      const amp = [15, 9, 13], tt = [T1, T2, T3];
      for (let k = 0; k < 3; k++) {
        const dt = t - tt[k];
        if (dt > 0) y += amp[k] * Math.exp(-dt * 7) * Math.sin(d * .03 - dt * 38) * Math.exp(-d / 260);
      }
      i ? ctx.lineTo(960 + x, G1 + y) : ctx.moveTo(960 + x, G1 + y);
    }
    ctx.stroke();
  }
  // captions
  const ca = pr(t, T1 + .12, .25) * (1 - pr(t, T3, .12));
  if (ca > 0) {
    ctx.fillStyle = PAPER;
    monoText(typeOn('FIG. 00 — THE BOUNCING BALL', pr(t, T1 + .1, .35)), 242, G1 + 46, 15, { alpha: .55 * ca });
    const bs = ball(t);
    monoText(`Y ${String(Math.max(0, Math.round(G1 - R1 - by))).padStart(3, '0')}   SQUASH ${bs.sy.toFixed(2)}`, 1678, G1 + 46, 15, { align: 'right', alpha: .55 * ca });
  }
  // impact bursts
  [T1, T2, T3].forEach((T, k) => {
    const p = pr(t, T, .36);
    if (p <= 0 || p >= 1) return;
    const n = 9, r0 = R1 + 22 + [120, 80, 150][k] * E.outExpo(p), len = [46, 30, 54][k] * (1 - E.outCubic(p));
    ctx.strokeStyle = k === 1 ? PAPER : ORANGE; ctx.lineWidth = 5; ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < n; i++) {
      const a = -PI * (i + .5) / n, c = Math.cos(a), s = Math.sin(a);
      ctx.moveTo(960 + c * r0, G1 - 8 + s * r0 * .8); ctx.lineTo(960 + c * (r0 + len), G1 - 8 + s * (r0 + len) * .8);
    }
    ctx.stroke();
  });
  // ball + smear trail, then it swallows the frame
  const grow = E.inQuint(pr(t, B(3.3), B(.7)));
  ctx.fillStyle = ORANGE;
  if (grow < .002) {
    for (let g = 5; g >= 0; g--) {
      const tt = t - g * .013;
      if (tt < -.05) continue;
      const b = ball(tt);
      ctx.globalAlpha = g ? .16 * (1 - g / 6) : 1;
      ctx.beginPath(); ctx.ellipse(960, b.y, R1 * b.sx, R1 * b.sy, 0, 0, TAU); ctx.fill();
    }
    ctx.globalAlpha = 1;
  } else {
    disc(960, ballY(t), R1 + (1320 - R1) * grow);
  }
}

/* ═════════════════════ 01 · TYPE — I MAKE / THINGS / MOVE ═════════════════════ */
const SPEED = (() => { const r = rng(5); return Array.from({ length: 18 }, () => ({ y: 40 + r() * 1000, len: 160 + r() * 520, sp: 2600 + r() * 2600, off: r() * 3000, w: 2 + r() * 5 })); })();
function s2(t) {
  const b = t / BEAT;
  if (b < 6) {
    bg(ORANGE);
    ctx.fillStyle = INK;
    if (b < 5) {
      const size = Math.min(fitSize('I MAKE', 1480), 480), cap = CAP * size, base = 540 + cap / 2 - 14;
      const m = riseWord('I MAKE', 960, base, size, t, { align: 'c', tin: B(4), stag: .032, din: .42, tout: B(4.74), dout: .11, stagOut: .008, outDir: -1, color: INK });
      const a = E.outExpo(pr(t, B(4) + .1, .45)), z = E.inCubic(pr(t, B(4.72), .12));
      ctx.fillStyle = INK;
      ctx.fillRect(m.x0 + m.w * z, base + 34, m.w * (a - z), 12);
    } else {
      const size = Math.min(fitSize('THINGS', 1560), 480), L = word('THINGS', size), cap = CAP * size, base = 540 + cap / 2, x0 = 960 - L.w / 2;
      ctx.font = fSans(size); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
      for (let i = 0; i < 6; i++) {
        const pin = E.outBack(pr(t, B(5) + i * .022, .3), 2.4), pout = E.inCubic(pr(t, B(5.76) + i * .008, .1));
        if (pin <= 0 || pout >= 1) continue;
        ctx.save();
        ctx.translate(x0 + L.xs[i], base);
        if (pout > 0) { ctx.translate(0, -cap); ctx.scale(1, 1 - pout); ctx.translate(0, cap); }
        else ctx.scale(1, Math.max(.001, pin));
        ctx.fillText('THINGS'[i], 0, 0);
        ctx.restore();
      }
    }
    return;
  }
  // MOVE
  bg(INK);
  const dt = t - B(6);
  const size = Math.min(fitSize('MOVE', 1400), 500), L = word('MOVE', size), cap = CAP * size, base = 540 + cap / 2, x0 = 960 - L.w / 2;
  const slam = 1 + 1.7 * (1 - E.outExpo(pr(t, B(6), .3)));
  const sh = 16 * Math.exp(-dt * 12);
  const spread = E.outExpo(pr(t, B(6.45), .45)) * (1 - E.inCubic(pr(t, B(7.4), .16)));
  const kick7 = t >= B(7) ? Math.exp(-(t - B(7)) * 9) : 0;
  ctx.save();
  ctx.translate(Math.sin(t * 190) * sh, Math.cos(t * 233) * sh);
  // speed lines
  if (spread > 0) {
    ctx.fillStyle = PAPER;
    for (const s of SPEED) {
      const x = W + 300 - mod(s.off + t * s.sp, W + 1400);
      ctx.globalAlpha = .16 * spread;
      ctx.fillRect(x, s.y, s.len, s.w);
    }
    ctx.globalAlpha = 1;
  }
  ctx.translate(960, 540); ctx.scale(slam, slam); ctx.translate(-960, -540);
  ctx.font = fSans(size); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  const track = i => (i - 1.5) * 46 * kick7;
  const ocx = x0 + L.xs[1] + L.ws[1] / 2, ocy = base - cap / 2, orad = cap * .5;
  // outlined echoes, waving
  if (spread > .001) {
    ctx.strokeStyle = PAPER; ctx.lineWidth = 2.5; ctx.lineJoin = 'round';
    for (let k = 4; k >= 1; k--) for (const sg of [-1, 1]) {
      const oy = sg * k * cap * .47 * spread, ox = Math.sin(t * 9 - k * .85) * 56 * spread * sg;
      ctx.globalAlpha = (1 - k / 5.5) * Math.min(1, spread * 3);
      for (const i of [0, 2, 3]) ctx.strokeText('MOVE'[i], x0 + L.xs[i] + ox + track(i), base + oy);
      ctx.beginPath(); ctx.arc(ocx + ox + track(1), ocy + oy, orad - 1, 0, TAU); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  // main letters, each leaving its own way
  const exits = [[-1, .15, -.5], null, [0, 1, .5], [1, -.1, .45]], delay = [0, 0, .035, .07];
  ctx.fillStyle = PAPER;
  for (const i of [0, 2, 3]) {
    const e = E.inQuart(pr(t, B(7.5) + delay[i], .2));
    if (e >= 1) continue;
    const cx = x0 + L.xs[i] + L.ws[i] / 2 + track(i), cy = base - cap / 2;
    ctx.save();
    ctx.translate(cx + exits[i][0] * 1700 * e, cy + exits[i][1] * 1100 * e);
    ctx.rotate(exits[i][2] * e);
    ctx.fillText('MOVE'[i], -L.ws[i] / 2, cap / 2);
    ctx.restore();
  }
  // the O is the dot — it survives the cut
  const pd = E.inOutCubic(pr(t, B(7.45), B(.55)));
  ctx.fillStyle = ORANGE;
  disc(lerp(ocx + track(1), 1020, pd), lerp(ocy, 540, pd), lerp(orad, 60, pd));
  ctx.restore();
}

/* ═════════════════════ 02 · SYSTEM — 16×9 tile grid ═════════════════════ */
const TILES = (() => {
  const r = rng(2026), out = [];
  const pick = a => a[(r() * a.length) | 0];
  const types = [0, 0, 1, 1, 1, 2, 2, 3, 3, 4, 5, 6, 7, 8, 8, 9];
  const mk = () => {
    const q = r();
    const bgc = q < .52 ? PAPER : q < .68 ? INK : q < .78 ? BLUE : q < .87 ? ORANGE : q < .94 ? LIME : PINK;
    const fg = bgc === PAPER ? pick([INK, INK, INK, ORANGE, BLUE, PINK]) : bgc === INK ? pick([PAPER, PAPER, ORANGE, LIME, PINK, BLUE]) : pick([INK, PAPER]);
    return { type: pick(types), rot: (r() * 4) | 0, bg: bgc, fg };
  };
  for (let row = 0; row < 9; row++) for (let c = 0; c < 16; c++) {
    const cx = c * 120 + 60, cy = row * 120 + 60, hero = c === 8 && row === 4;
    const d = Math.hypot(cx - 1020, cy - 540) / 1130;
    const pats = hero
      ? [{ type: -1, rot: 0, bg: PAPER, fg: ORANGE }, { type: -1, rot: 0, bg: INK, fg: ORANGE }, { type: -1, rot: 0, bg: PAPER, fg: ORANGE }]
      : [mk(), mk(), mk()];
    out.push({ cx, cy, d, hero, pats });
  }
  return out;
})();
function tileShape(type) {
  const h = 60;
  if (type < 0) return;
  ctx.beginPath();
  switch (type) {
    case 0: ctx.arc(0, 0, h, 0, TAU); break;
    case 1: ctx.moveTo(-h, -h); ctx.arc(-h, -h, 2 * h, 0, PI / 2); ctx.closePath(); break;
    case 2: ctx.arc(0, -h, h, 0, PI); ctx.closePath(); break;
    case 3: ctx.moveTo(-h, -h); ctx.lineTo(h, -h); ctx.lineTo(-h, h); ctx.closePath(); break;
    case 4: ctx.moveTo(-h, -h); ctx.arc(-h, -h, h, 0, PI / 2); ctx.closePath(); ctx.moveTo(h, h); ctx.arc(h, h, h, PI, PI * 1.5); ctx.closePath(); break;
    case 5: ctx.arc(0, 0, h, 0, TAU); ctx.moveTo(h * .62, 0); ctx.arc(0, 0, h * .62, 0, TAU, true); ctx.moveTo(h * .28, 0); ctx.arc(0, 0, h * .28, 0, TAU); break;
    case 6: ctx.rect(-h, -h, 2 * h, h * .4); ctx.rect(-h, -h * .2, 2 * h, h * .4); ctx.rect(-h, h * .6, 2 * h, h * .4); break;
    case 7: ctx.rect(-h, -h, 2 * h, h); break;
    case 8: ctx.arc(-h, -h, 2 * h, 0, PI / 2); ctx.arc(-h, -h, h, PI / 2, 0, true); ctx.closePath(); break;
    case 9: ctx.arc(0, 0, h * .36, 0, TAU); break;
  }
  ctx.fill();
}
function s3(t) {
  const b = t / BEAT;
  bg(b < 11 ? INK : BLUE);
  for (const T of TILES) {
    const pop = E.outBack(pr(t, B(8) + T.d * .4, .32), 1.4);
    if (pop <= 0) continue;
    const f1 = E.inOutCubic(pr(t, B(9) + T.d * .28, .32)), f2 = E.inOutCubic(pr(t, B(10) + T.d * .28, .32));
    const sh = E.inOutCubic(pr(t, B(11) + T.d * .2, .24));
    if (sh > 0) { ctx.fillStyle = T.hero ? ORANGE : PAPER; disc(T.cx, T.cy, 5); }
    if (sh >= 1) continue;
    let pat = T.pats[0], sx = 1, sy = 1;
    if (f2 > 0) { pat = f2 < .5 ? T.pats[1] : T.pats[2]; sy = Math.abs(Math.cos(f2 * PI)); }
    else if (f1 > 0) { pat = f1 < .5 ? T.pats[0] : T.pats[1]; sx = Math.abs(Math.cos(f1 * PI)); }
    const s = pop * (1 - sh);
    ctx.save();
    ctx.translate(T.cx, T.cy);
    ctx.scale(Math.max(.001, sx * s), Math.max(.001, sy * s));

  // bar 8 — resolve
  pad(B(28), [45, 57, 60, 64, 71], B(3.6), .04, 2600, 500);
  [45, 57, 64, 71].forEach((m, i) => pluck(B(28), m, 2.4, .1, (i - 1.5) * .3, 2800, .8));
  [[28.5, 76], [29, 79], [29.5, 83], [30, 88]].forEach(([b, m], i) => pluck(B(b), m, .7, .09, i % 2 ? .4 : -.4, 4200, 1));
  glide(B(31.74), B(.26), 260, 3200, .1);

  const rendered = await oc.startRendering();
  // safety normalise so nothing clips on output
  let peak = 0;
  for (let c = 0; c < rendered.numberOfChannels; c++) { const d = rendered.getChannelData(c); for (let i = 0; i < d.length; i++) { const v = Math.abs(d[i]); if (v > peak) peak = v; } }
  if (peak > .9) { const g = .9 / peak; for (let c = 0; c < rendered.numberOfChannels; c++) { const d = rendered.getChannelData(c); for (let i = 0; i < d.length; i++) d[i] *= g; } }
  return rendered;
}

/* ───────────────────────── transport ───────────────────────── */
const qs = new URLSearchParams(location.search);
const frozen = qs.has('t') ? parseFloat(qs.get('t')) : null;
const hint = document.getElementById('hint'), hintTxt = hint.querySelector('span');
let ac = null, buf = null, src = null, soundOn = false, building = false;
let playing = true, off = 0, t0 = performance.now(), acT0 = 0;

function curT() {
  if (frozen != null) return frozen;
  if (!playing) return off;
  if (soundOn && src) return mod(off + (ac.currentTime - acT0) - (ac.outputLatency || 0), DUR);
  return mod(off + (performance.now() - t0) / 1000, DUR);
}
function stopSrc() { if (src) { try { src.stop(); } catch (e) {} src.disconnect(); src = null; } }
function startSrc(at) {
  stopSrc();
  src = ac.createBufferSource(); src.buffer = buf; src.loop = true; src.connect(ac.destination);
  off = mod(at, DUR); acT0 = ac.currentTime + .04; src.start(acT0, off);
}
function setHint(txt, hide) {
  hintTxt.textContent = txt; hint.classList.remove('off');
  clearTimeout(setHint.tm);
  if (hide) setHint.tm = setTimeout(() => hint.classList.add('off'), 1400);
}
async function toggleSound() {
  if (frozen != null || building) return;
  if (soundOn) {
    const t = curT(); soundOn = false; stopSrc(); off = t; t0 = performance.now();
    setHint('SOUND OFF', true); return;
  }
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') await ac.resume();
    if (!buf) { building = true; setHint('RENDERING AUDIO…'); buf = await buildAudio(); building = false; }
    const t = curT(); soundOn = true;
    if (playing) startSrc(t); else off = t;
    setHint('SOUND ON · M TO MUTE', true);
  } catch (e) { building = false; setHint('AUDIO UNAVAILABLE', true); }
}
function togglePlay() {
  if (frozen != null) return;
  if (playing) { off = curT(); playing = false; stopSrc(); render(off); }
  else { playing = true; t0 = performance.now(); if (soundOn) startSrc(off); }
}
function seek(to) {
  if (frozen != null) return;
  to = mod(to, DUR);
  if (playing && soundOn) startSrc(to); else { off = to; t0 = performance.now(); if (!playing) render(off); }
}
document.getElementById('stage').addEventListener('click', toggleSound);
hint.addEventListener('click', toggleSound);
addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.key === 'm' || e.key === 'M') toggleSound();
  else if (e.key === 'ArrowRight') seek(curT() + BEAT);
  else if (e.key === 'ArrowLeft') seek(curT() - BEAT);
  else if (e.key === 'r' || e.key === 'R') seek(0);
  else if (e.key === 'f' || e.key === 'F') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); }
});

/* ───────────────────────── go ───────────────────────── */
resize();
init6();
if (frozen != null) { hint.style.display = 'none'; render(frozen); }
else {
  const loop = () => { if (playing) render(curT()); requestAnimationFrame(loop); };
  requestAnimationFrame(loop);
}
})();
</script>
