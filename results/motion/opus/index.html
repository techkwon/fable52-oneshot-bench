<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLAUDE — Motion Reel ’26</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;color:#eee;
    font-family:"SF Mono",ui-monospace,Menlo,Consolas,monospace;-webkit-font-smoothing:antialiased}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
  #ui{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);width:min(920px,94vw);
    display:flex;align-items:center;gap:14px;padding:9px 12px 9px 9px;box-sizing:border-box;
    background:rgba(14,14,20,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid rgba(255,255,255,.1);border-radius:999px;font-size:12px;letter-spacing:.04em;
    transition:opacity .45s ease,transform .45s cubic-bezier(.2,.9,.2,1);z-index:5}
  #ui.hide{opacity:0;transform:translateX(-50%) translateY(16px);pointer-events:none}
  #ui button{all:unset;cursor:pointer;display:grid;place-items:center;height:34px;border-radius:999px;
    color:#f3efe6;transition:background .2s}
  #ui button:hover{background:rgba(255,255,255,.1)}
  #pp,#fs{width:34px}
  #snd{padding:0 14px;border:1px solid rgba(255,255,255,.18);font-weight:600;white-space:nowrap}
  #snd.on{background:#ff3b1f;border-color:#ff3b1f;color:#0b0b10}
  #track{flex:1;position:relative;height:34px;cursor:pointer;touch-action:none}
  #track .rail{position:absolute;left:0;right:0;top:16px;height:2px;background:rgba(255,255,255,.16);border-radius:2px}
  #fill{position:absolute;left:0;top:16px;height:2px;background:#ff3b1f;border-radius:2px}
  #knob{position:absolute;top:11px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#f3efe6;
    box-shadow:0 0 0 4px rgba(255,59,31,.35)}
  .mk{position:absolute;top:12px;width:1px;height:10px;background:rgba(255,255,255,.35)}
  .mk span{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:9px;opacity:0;
    transition:opacity .2s;white-space:nowrap;color:#aaa}
  #track:hover .mk span{opacity:1}
  #tc{font-variant-numeric:tabular-nums;min-width:96px;text-align:right;opacity:.8}
  #hint{position:fixed;top:22px;left:50%;transform:translateX(-50%);padding:9px 16px;border-radius:999px;
    background:rgba(14,14,20,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,.1);font-size:12px;letter-spacing:.04em;white-space:nowrap;
    transition:opacity .8s ease;z-index:5;pointer-events:none}
  #hint b{color:#ff6a4f;font-weight:600}
  #hint.hide{opacity:0}
  #err{position:fixed;left:10px;top:10px;color:#f55;font-size:14px;z-index:9;white-space:pre}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hint">Press <b>S</b> for sound &nbsp;·&nbsp; <b>Space</b> pause &nbsp;·&nbsp; <b>← →</b> step a beat &nbsp;·&nbsp; <b>F</b> fullscreen</div>
<div id="ui">
  <button id="pp" aria-label="Play / pause"></button>
  <div id="track"><div class="rail"></div><div id="fill"></div><div id="knob"></div></div>
  <span id="tc">00.00 / 15.00</span>
  <button id="snd" aria-label="Toggle sound">♪ SOUND OFF</button>
  <button id="fs" aria-label="Fullscreen"><svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M1 5V1h4M9 1h4v4M13 9v4H9M5 13H1V9"/></svg></button>
</div>
<div id="err"></div>
<script>
'use strict';
/* ============================================================================
   CLAUDE — MOTION REEL ’26
   A fully procedural, deterministic 15s showreel. Every frame is a pure
   function of time t, so it can be scrubbed, paused and looped perfectly.
   120 BPM · 1920×1080 design space · synthesized, beat-locked soundtrack.
   ========================================================================== */
const params=new URLSearchParams(location.search);
if(params.has('debug')) addEventListener('error',e=>{document.getElementById('err').textContent='ERR: '+e.message+' @'+e.lineno;});

const W=1920,H=1080,DUR=15,BPM=120,BEAT=60/BPM,TAU=Math.PI*2;
const C={ink:'#0b0b10',paper:'#f3efe6',red:'#ff3b1f',blue:'#2b3dff',yellow:'#ffd60a',mint:'#16e0a0',pink:'#ff4fa3',violet:'#7b3cff'};
const SANS='"Inter","Helvetica Neue",Helvetica,Arial,sans-serif';
const SERIF='"Didot","Bodoni 72","Playfair Display",Georgia,"Times New Roman",serif';
const MONO='"JetBrains Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace';
const font=(w,s,f=SANS)=>`${w} ${s}px ${f}`;
const capY=s=>s*0.36;

/* ---------------------------------------------------------------- math ---- */
const clamp=(v,a=0,b=1)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const P=(t,a,b)=>clamp((t-a)/(b-a));
const E={
  outQuad:t=>1-(1-t)*(1-t),
  inCubic:t=>t*t*t,
  outCubic:t=>1-Math.pow(1-t,3),
  inOutCubic:t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2,
  outQuart:t=>1-Math.pow(1-t,4),
  inOutQuart:t=>t<.5?8*t*t*t*t:1-Math.pow(-2*t+2,4)/2,
  inExpo:t=>t<=0?0:Math.pow(2,10*t-10),
  outExpo:t=>t>=1?1:1-Math.pow(2,-10*t),
  inOutExpo:t=>t<=0?0:t>=1?1:t<.5?Math.pow(2,20*t-10)/2:(2-Math.pow(2,-20*t+10))/2,
  outBack:t=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2);},
  inBack:t=>{const c1=1.70158,c3=c1+1;return c3*t*t*t-c1*t*t;},
};
const spr=(t,f=2.2,d=7)=>t<=0?0:1-Math.exp(-d*t)*Math.cos(TAU*f*t);
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x);};
function hexRGB(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}

/* -------------------------------------------------------------- canvas ---- */
const cvs=document.getElementById('c'),ctx=cvs.getContext('2d');
let DPR=1,SC=1,OX=0,OY=0,CW=0,CH=0;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  CW=Math.floor(innerWidth*DPR);CH=Math.floor(innerHeight*DPR);
  const maxPx=3840*2160; if(CW*CH>maxPx){const k=Math.sqrt(maxPx/(CW*CH));CW=Math.floor(CW*k);CH=Math.floor(CH*k);}
  cvs.width=CW;cvs.height=CH;
  SC=Math.min(CW/W,CH/H);OX=(CW-W*SC)/2;OY=(CH-H*SC)/2;
}
addEventListener('resize',resize);resize();

function bg(c){ctx.fillStyle=c;ctx.fillRect(-80,-80,W+160,H+160);}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function layout(s,size,w=900,f=SANS,track=0){
  ctx.font=font(w,size,f);
  const chars=[...s],ws=chars.map(ch=>ctx.measureText(ch).width);
  const total=ws.reduce((a,b)=>a+b,0)+track*(chars.length-1);
  let x=-total/2;const letters=[];
  chars.forEach((ch,i)=>{letters.push({ch,x:x+ws[i]/2,w:ws[i]});x+=ws[i]+track;});
  return{letters,total};
}
function circle(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,TAU);}

/* ---------------------------------------------------- shape morph kit ---- */
function polyR(th,n,r1,r2,rot){
  const seg=TAU/n;let a=((th-rot)%TAU+TAU)%TAU;const k=Math.floor(a/seg)%n;const t1=k*seg,t2=t1+seg;
  const ra=(k%2===0)?r1:r2,rb=(k%2===0)?r2:r1;
  return ra*rb*Math.sin(seg)/(ra*Math.sin(a-t1)+rb*Math.sin(t2-a));
}
const SHAPES=[
  ()=>1,
  th=>polyR(th,4,1.2,1.2,Math.PI/4),
  th=>polyR(th,3,1.34,1.34,-Math.PI/2),
  th=>polyR(th,10,1.4,0.6,-Math.PI/2),
];
function morphPath(x,y,R,a,b,m,rot,sx=1,sy=1,n=120){
  ctx.beginPath();
  for(let k=0;k<n;k++){
    const th=k/n*TAU,r=lerp(SHAPES[a](th),SHAPES[b](th),m)*R;
    const px=Math.cos(th+rot)*r*sx,py=Math.sin(th+rot)*r*sy;
    k?ctx.lineTo(x+px,y+py):ctx.moveTo(x+px,y+py);
  }
  ctx.closePath();
}

/* =========================================================================
   SCENE 01 — IGNITION  (dot → line → "I MAKE THINGS MOVE")
   ========================================================================= */
function s1(t){
  const cx=W/2,cy=H/2;
  bg(C.ink);
  [0.1,0.3].forEach((rt,k)=>{const p=P(t,rt,rt+0.85);if(p>0&&p<1){
    ctx.strokeStyle=C.paper;ctx.globalAlpha=(1-p)*0.75;ctx.lineWidth=1.5+(1-p)*4;
    circle(cx,cy,24+E.outCubic(p)*(360+k*220));ctx.stroke();ctx.globalAlpha=1;}});
  if(t<1.16){
    const pin=E.outBack(P(t,0,0.26));
    const beat=1+0.18*Math.sin(P(t,0.26,0.36)*Math.PI);
    const ant=Math.sin(P(t,0.34,0.48)*Math.PI)*(t<0.48?1:0);
    const st=E.inOutExpo(P(t,0.46,0.86));
    let w=lerp(46,W+120,st),h=lerp(46,10,E.outQuart(P(t,0.46,0.64)));
    w*=pin*beat*(1-ant*0.32);h*=pin*beat*(1+ant*0.38);
    const open=E.inOutExpo(P(t,0.9,1.15));h=lerp(h,H+160,open);
    if(st>0.02&&st<0.999){ // chromatic fringe while stretching
      ctx.globalAlpha=0.9;ctx.fillStyle=C.red;rr(cx-w/2,cy-h/2+7,w,h,h/2);ctx.fill();
      ctx.fillStyle=C.blue;rr(cx-w/2,cy-h/2-7,w,h,h/2);ctx.fill();ctx.globalAlpha=1;
    }
    ctx.fillStyle=C.paper;rr(cx-w/2,cy-h/2,w,h,Math.min(w,h)/2*(1-open));ctx.fill();
  }else bg(C.paper);

  const words=[
    {s:'I',a:1.15,size:460,w:'italic 400',f:SERIF},
    {s:'MAKE',a:1.4,size:340,w:900,mark:true},
    {s:'THINGS',a:1.65,size:300,w:900,stroke:true},
  ];
  for(const wd of words){
    if(t<wd.a||t>=wd.a+0.25)continue;
    const e=E.outExpo(P(t,wd.a,wd.a+0.17));
    ctx.save();
    ctx.beginPath();ctx.rect(0,cy-wd.size*0.6,W,wd.size*1.2);ctx.clip();
    ctx.translate(cx,cy+(1-e)*wd.size*0.95);
    const sc=lerp(1.25,1,e);ctx.scale(sc,sc);
    ctx.font=font(wd.w,wd.size,wd.f||SANS);ctx.textAlign='center';ctx.textBaseline='alphabetic';
    if(wd.mark){const mw=ctx.measureText(wd.s).width+60,q=E.outExpo(P(t,wd.a+0.02,wd.a+0.2));
      ctx.fillStyle=C.red;ctx.fillRect(-mw/2,capY(wd.size)*0.15,mw*q,capY(wd.size)*0.75);}
    if(wd.stroke){ctx.lineWidth=7;ctx.strokeStyle=C.ink;ctx.lineJoin='round';ctx.strokeText(wd.s,0,capY(wd.size));}
    else{ctx.fillStyle=C.ink;ctx.fillText(wd.s,0,capY(wd.size)+(wd.f===SERIF?wd.size*0.02:0));}
    ctx.restore();
    // tiny registration annotations
    ctx.font=font(500,20,MONO);ctx.fillStyle=C.ink;ctx.textAlign='left';
    ctx.globalAlpha=0.55;ctx.fillText(`[ 0${words.indexOf(wd)+1} / 04 ]`,cx-wd.size*0.9,cy-wd.size*0.5);ctx.globalAlpha=1;
  }
  if(t>=1.88)drawMove(t);
}
function drawMove(t){
  const cx=W/2,cy=H/2;
  ctx.fillStyle=C.red;circle(cx,cy,E.outExpo(P(t,1.88,2.12))*1250);ctx.fill();
  const size=410,L=layout('MOVE',size,900,SANS,-14),base=cy+capY(size);
  const Y=(i,tt)=>{const lt=tt-1.92-i*0.055;
    return -760*(1-spr(lt,2.6,9))+(tt>2.3?Math.sin((tt-2.3)*11-i*1.1)*26*P(tt,2.3,2.48):0);};
  ctx.font=font(900,size,SANS);ctx.textAlign='center';ctx.textBaseline='alphabetic';
  for(let k=5;k>=0;k--){
    const tt=t-k*0.03;
    L.letters.forEach((l,i)=>{
      const y=Y(i,tt),v=(y-Y(i,tt-0.01))/0.01,s=clamp(Math.abs(v)/7000,0,0.36);
      ctx.save();ctx.translate(cx+l.x,base+y-capY(size));ctx.scale(1-s*0.45,1+s);
      ctx.rotate(tt>2.3?Math.sin((tt-2.3)*9-i)*0.05*P(tt,2.3,2.45):0);
      if(k){ctx.globalAlpha=0.28*(1-k/6);ctx.strokeStyle=C.ink;ctx.lineWidth=3;ctx.strokeText(l.ch,0,capY(size));}
      else{ctx.fillStyle=C.ink;ctx.fillText(l.ch,0,capY(size));}
      ctx.restore();
    });
  }
  const cap='motion · design · direction',n=Math.floor(P(t,2.05,2.35)*cap.length);
  ctx.font=font(500,26,MONO);ctx.fillStyle=C.ink;ctx.textAlign='center';
  ctx.fillText(cap.slice(0,n)+(n<cap.length&&n>0?'▍':''),cx,base+110);
}

/* =========================================================================
   SCENE 02 — FORM  (morphing primitives → rippling shape field)
   ========================================================================= */
const GRIDC=[C.yellow,C.paper,C.pink,C.ink];
function s2(t){
  const cx=W/2,cy=H/2;
  bg(C.blue);
  // concentric guides
  ctx.strokeStyle=C.paper;ctx.lineWidth=1.5;ctx.globalAlpha=0.12;
  for(let k=1;k<7;k++){circle(cx,cy,k*150+((t*80)%150));ctx.stroke();}
  ctx.globalAlpha=1;

  const keys=[0.45,0.7,0.95];
  let a=0,b=0,m=0,rot=t*0.6,sq=0;
  keys.forEach((kt,k)=>{const p=P(t,kt,kt+0.26);if(t>=kt){a=k;b=k+1;m=E.outBack(p);}
    rot+=E.outBack(p)*Math.PI/2;sq+=Math.sin(p*Math.PI)*0.22;});
  const pop=P(t,1.1,1.32);
  const R=250*E.outBack(P(t,0.02,0.36))*(1-E.inBack(pop));
  const orbS=E.outBack(P(t,0.12,0.5))*(1-E.inBack(pop));

  // shape field
  if(t>1.1){
    const cs=120;
    for(let j=0;j<9;j++)for(let i=0;i<16;i++){
      const x=cs/2+i*cs,y=cs/2+j*cs,d=Math.hypot(x-cx,y-cy),dl=1.12+d/1100*0.4;
      const q=E.outBack(P(t,dl,dl+0.3));if(q<=0)continue;
      const wave=Math.sin(t*7-d*0.012);
      const s=40*q*(0.8+0.25*wave);
      const ty=(i+j)%4,mm=0.5+0.5*Math.sin(t*5-d*0.01);
      ctx.fillStyle=GRIDC[(i*3+j*5)%4];
      morphPath(x,y,s,ty,(ty+1)%4,mm,wave*Math.PI/3+t,1,1,40);ctx.fill();
    }
  }
  const orb=front=>{for(let k=0;k<3;k++){
    const ang=t*3.2+k*TAU/3,z=Math.sin(ang);if((z>0)!==front)continue;
    const ex=Math.cos(ang)*420,ey=Math.sin(ang)*120,c=Math.cos(-0.35),s=Math.sin(-0.35);
    ctx.fillStyle=[C.paper,C.pink,C.mint][k];
    circle(cx+ex*c-ey*s,cy+ex*s+ey*c,(16+k*7)*(1+z*0.35)*orbS);ctx.fill();}};
  orb(false);
  if(R>0.5){
    const sx=1+sq,sy=1-sq*0.8;
    ctx.fillStyle=C.ink;morphPath(cx+24,cy+24,R,a,b,m,rot,sx,sy);ctx.fill();
    ctx.fillStyle=C.yellow;morphPath(cx,cy,R,a,b,m,rot,sx,sy);ctx.fill();
    ctx.save();ctx.setLineDash([4,16]);ctx.lineDashOffset=-t*120;ctx.strokeStyle=C.paper;ctx.lineWidth=3;ctx.globalAlpha=0.7;
    circle(cx,cy,R*1.62);ctx.stroke();ctx.restore();
    // after-effects style callout
    const ca=E.outExpo(P(t,0.3,0.6))*(1-P(t,1.0,1.1));
    if(ca>0){
      ctx.strokeStyle=C.paper;ctx.fillStyle=C.paper;ctx.lineWidth=2;ctx.globalAlpha=ca;
      const x0=cx+R*0.9,y0=cy-R*0.9,x1=x0+150*ca,y1=y0-120*ca;
      ctx.beginPath();ctx.moveTo(x0,y0);ctx.lineTo(x1,y1);ctx.lineTo(x1+260*ca,y1);ctx.stroke();
      circle(x0,y0,6);ctx.fill();
      ctx.font=font(500,22,MONO);ctx.textAlign='left';
      const names=['circle','square','triangle','star'];
      ctx.fillText(`shape: ${names[b]}  ease: back.out(1.7)`,x1+8,y1-16);
      ctx.fillText(`rot: ${Math.round(rot*180/Math.PI)%360}°  scale: ${(sx).toFixed(2)}`,x1+8,y1+28);
      ctx.globalAlpha=1;
    }
  }
  orb(true);
  // big word
  const wl=E.outExpo(P(t,0.15,0.55))*(1-E.inCubic(P(t,1.05,1.25)));
  if(wl>0){ctx.save();ctx.globalAlpha=wl;ctx.font=font(900,120,SANS);ctx.fillStyle=C.paper;ctx.textAlign='left';
    ctx.fillText('FORM',110,H-160+(1-wl)*60);ctx.font=font(500,22,MONO);ctx.fillText('follows motion.',118,H-120+(1-wl)*60);ctx.restore();}
}

/* =========================================================================
   SCENE 03 — PARTICLES  (vortex → "DESIGN" → detonation)
   ========================================================================= */
const NP=3200;
const PX={tx:new Float32Array(NP),ty:new Float32Array(NP),a:new Float32Array(NP),r:new Float32Array(NP),
  d:new Float32Array(NP),ex:new Float32Array(NP),ey:new Float32Array(NP),ed:new Float32Array(NP),b:[[],[],[],[]]};
const PCOL=[C.paper,C.red,C.yellow,C.mint];
function initParticles(){
  const oc=document.createElement('canvas');oc.width=W;oc.height=H;const o=oc.getContext('2d');
  o.fillStyle='#fff';o.font=font(900,330,SANS);o.textAlign='center';o.textBaseline='alphabetic';
  o.fillText('DESIGN',W/2,H/2+capY(330));
  const d=o.getImageData(0,0,W,H).data,pts=[];
  for(let y=0;y<H;y+=4)for(let x=0;x<W;x+=4)if(d[(y*W+x)*4+3]>140)pts.push([x,y]);
  const R=mulberry32(7);
  for(let i=pts.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[pts[i],pts[j]]=[pts[j],pts[i]];}
  PX.b=[[],[],[],[]];
  for(let i=0;i<NP;i++){
    const p=pts.length?pts[i%pts.length]:[W/2,H/2];
    PX.tx[i]=p[0]+(R()-0.5)*2;PX.ty[i]=p[1]+(R()-0.5)*2;
    PX.a[i]=R()*TAU;PX.r[i]=140+Math.pow(R(),0.7)*1000;PX.d[i]=R()*0.3;
    let dx=p[0]-W/2,dy=p[1]-H/2;const l=Math.hypot(dx,dy)||1,ang=Math.atan2(dy/l,dx/l)+(R()-0.5)*1.1;
    PX.ex[i]=Math.cos(ang);PX.ey[i]=Math.sin(ang)*0.8;PX.ed[i]=500+R()*1500;
    const c=R();PX.b[c<0.68?0:c<0.8?1:c<0.92?2:3].push(i);
  }
}
let _x=0,_y=0;
function ppos(i,t){
  const r0=PX.r[i],a=PX.a[i]+t*(0.8+340/r0),rr0=r0*(1-0.35*E.outCubic(P(t,0,1)));
  let x=W/2+Math.cos(a)*rr0*1.3,y=H/2+Math.sin(a)*rr0*0.72;
  const dl=PX.d[i],q=E.inOutQuart(P(t,0.4+dl,0.95+dl));
  x+=(PX.tx[i]-x)*q;y+=(PX.ty[i]-y)*q;
  const hold=q*(1-P(t,1.55,1.6));
  x+=Math.sin(t*8+i)*1.4*hold;y+=Math.cos(t*7+i*1.3)*1.4*hold;
  const e=E.outExpo(P(t,1.56+dl*0.12,2.4+dl*0.12));
  x+=PX.ex[i]*e*PX.ed[i];y+=PX.ey[i]*e*PX.ed[i]+260*e*e;
  _x=x;_y=y;
}
function s3(t){
  bg(C.ink);
  const form=E.outCubic(P(t,0.6,1.25))*(1-P(t,1.56,1.9));
  if(form>0){
    const g=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,900);
    g.addColorStop(0,`rgba(255,59,31,${0.28*form})`);g.addColorStop(1,'rgba(255,59,31,0)');
    ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  }
  // shockwave

    else{stopAll();actx.suspend();}
  }
  pp.innerHTML=v?IC_PAUSE:IC_PLAY;}
function setTime(T){tl=((T%DUR)+DUR)%DUR;if(soundOn&&actx){stopAll();origin=actx.currentTime-tl;schedUntil=tl;}}
async function toggleSound(){
  if(!soundOn){if(!actx)initAudio();try{await actx.resume();}catch(e){}
    soundOn=true;origin=actx.currentTime-tl;schedUntil=tl;if(!playing)actx.suspend();}
  else{soundOn=false;stopAll();last=performance.now();}
  snd.textContent=soundOn?'♪ SOUND ON':'♪ SOUND OFF';snd.classList.toggle('on',soundOn);
}
let hideT;function poke(){ui.classList.remove('hide');clearTimeout(hideT);hideT=setTimeout(()=>ui.classList.add('hide'),2600);}
addEventListener('mousemove',poke);addEventListener('touchstart',poke,{passive:true});
setTimeout(()=>hint.classList.add('hide'),5200);
pp.onclick=e=>{e.stopPropagation();setPlaying(!playing);poke();};
snd.onclick=e=>{e.stopPropagation();toggleSound();poke();};
$('fs').onclick=e=>{e.stopPropagation();toggleFS();};
function toggleFS(){if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.();}
cvs.addEventListener('click',()=>{setPlaying(!playing);poke();});
let drag=false;
const seekFromEvent=e=>{const r=trackEl.getBoundingClientRect();setTime(clamp((e.clientX-r.left)/r.width,0,0.9999)*DUR);};
trackEl.addEventListener('pointerdown',e=>{drag=true;trackEl.setPointerCapture(e.pointerId);seekFromEvent(e);});
trackEl.addEventListener('pointermove',e=>{if(drag)seekFromEvent(e);});
trackEl.addEventListener('pointerup',()=>{drag=false;});
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();setPlaying(!playing);}
  else if(e.key==='s'||e.key==='S')toggleSound();
  else if(e.key==='r'||e.key==='R')setTime(0);
  else if(e.key==='f'||e.key==='F')toggleFS();
  else if(e.key==='ArrowRight')setTime(tl+BEAT);
  else if(e.key==='ArrowLeft')setTime(tl-BEAT);
  else if(e.key==='h'||e.key==='H'){ui.classList.add('hide');return;}
  poke();
});
function updateUI(){const p=tl/DUR*100;fillEl.style.width=p+'%';knob.style.left=p+'%';tcEl.textContent=tl.toFixed(2).padStart(5,'0')+' / 15.00';}

function frame(ts){
  if(playing){
    if(soundOn&&actx){if(actx.state==='running'){tl=(((actx.currentTime-origin)%DUR)+DUR)%DUR;schedule();}}
    else tl=(tl+Math.min(0.1,Math.max(0,(ts-last)/1000)))%DUR;
  }
  last=ts;
  render(tl);updateUI();
  requestAnimationFrame(frame);
}
function start(){initParticles();setPlaying(playing);poke();requestAnimationFrame(frame);}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start,start);
</script>
