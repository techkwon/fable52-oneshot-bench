      const angle = Math.random() * Math.PI * 2;
      const strength = 0.8 + Math.random() * 2.6; // 0.8 .. 3.4 m/s
      state.windVec.set(Math.cos(angle) * strength, 0, Math.sin(angle) * strength);
      elWindBadge.classList.add('visible');
      const screenAngleDeg = THREE.MathUtils.radToDeg(Math.atan2(state.windVec.z, state.windVec.x));
      elWindArrow.style.transform = `rotate(${screenAngleDeg.toFixed(0)}deg)`;
      elWindText.textContent = `${strength.toFixed(1)} m/s`;
    }

    function updateShooterSpot() {
      if (state.mode === 'around') {
        const spotIdx = Math.min(4, Math.floor(state.shotIndex / 3));
        const sp = FIVE_SPOTS[spotIdx];
        state.shooterPos.set(sp.x, 0, sp.z);
      } else {
        state.shooterPos.set(0, 0, FREE_THROW_Z);
      }

      const toHoopAngle = Math.atan2(-state.shooterPos.x, -state.shooterPos.z);
      const rightX = Math.cos(toHoopAngle), rightZ = -Math.sin(toHoopAngle);

      shooterRing.position.set(state.shooterPos.x, 0.005, state.shooterPos.z + 0.06);

      // Place 3D Ball Rack neatly to the shooter's right hand side
      ballRackGroup.position.set(
        state.shooterPos.x + rightX * 1.15,
        0,
        state.shooterPos.z + rightZ * 1.15 + 0.15
      );
      ballRackGroup.rotation.y = toHoopAngle + Math.PI * 0.5;

      // Update visible balls on the rack
      rackBalls.forEach((rb, i) => {
        if (state.mode === 'around') {
          const remInSpot = 3 - (state.shotIndex % 3);
          rb.visible = i >= (5 - remInSpot);
        } else if (state.mode === 'freethrow') {
          const rem = 10 - state.shotIndex;
          rb.visible = i < Math.min(5, Math.max(0, rem - 1));
        } else {
          rb.visible = true;
        }
      });
    }

    function prepareNextShot() {
      if (state.mode === 'freethrow' && state.shotIndex >= 10) {
        finishRound();
        return;
      }
      if (state.mode === 'around' && state.shotIndex >= 15) {
        finishRound();
        return;
      }
      if (state.mode === 'blitz' && state.blitzTime <= 0) {
        finishRound();
        return;
      }

      state.phase = 'ready';
      state.meterVal = 0;
      state.isMoneyBall = isShotMoneyBall(state.mode, state.shotIndex);

      updateShooterSpot();
      refreshWindForShot();

      playerBallMesh.material = state.isMoneyBall ? moneyBallMat : standardBallMat;
      playerBallMesh.visible = true;

      shotBall.pos.set(state.shooterPos.x, 1.98, state.shooterPos.z);
      shotBall.vel.set(0, 0, 0);
      shotBall.omega.set(0, 0, 0);

      updateHUD();
      update3DScoreboard();
    }

    function startMode(newMode) {
      state.mode = newMode;
      state.score = 0;
      state.made = 0;
      state.attempts = 0;
      state.swishes = 0;
      state.streak = 0;
      state.maxStreak = 0;
      state.shotIndex = 0;
      state.shotResults = [];
      state.blitzTime = 60.0;
      state.blitzStarted = false;
      state.buzzerTriggered = false;
      state.aimYawOffset = 0;
      state.launchDeg = 54;
      state.bankAimFactor = 0;
      state.ledFlashTimer = 0;
      boardLedMat.color.setHex(0x1c2c4c);

      elSummaryModal.classList.remove('open');
      document.querySelectorAll('.mode-btn').forEach((b) => {
        b.classList.toggle('active', b.dataset.mode === newMode);
      });

      prepareNextShot();
    }

    function handOffToGhostBall() {
      let slot = ghostBalls.find((g) => !g.active);
      if (!slot) slot = ghostBalls[0];
      slot.active = true;
      slot.age = 0;
      slot.pos.copy(shotBall.pos);
      slot.vel.copy(shotBall.vel);
      slot.omega.copy(shotBall.omega);
      slot.mesh.material = shotBall.isMoney ? moneyBallMat : standardBallMat;
      slot.mesh.position.copy(slot.pos);
      slot.mesh.quaternion.copy(playerBallMesh.quaternion);
      slot.mesh.visible = true;
    }

    function computeCurrentAimTarget() {
      const baseAngle = Math.atan2(-state.shooterPos.x, -state.shooterPos.z);
      const distToHoop = Math.hypot(state.shooterPos.x, state.shooterPos.z);

      if (state.bankAimFactor > 0.05) {
        // Targeting glass shooter's square for an intentional bank shot!
        const glassZ = BOARD_Z + BALL_RADIUS;
        const mirrorFactor = 0.051;
        const idealBankX = state.shooterPos.x * mirrorFactor;
        const lateralShift = Math.sin(state.aimYawOffset) * distToHoop * 0.85;
        const tx = THREE.MathUtils.clamp(idealBankX + lateralShift, -0.75, 0.75);
        const ty = 3.35 + state.bankAimFactor * 0.14;
        return {
          target: new THREE.Vector3(tx, ty, glassZ),
          isBankAim: true,
          idealBankX
        };
      } else {
        // Direct hoop plane aim
        const lateralShift = Math.sin(state.aimYawOffset) * distToHoop * 0.88;
        const rightX = Math.cos(baseAngle), rightZ = -Math.sin(baseAngle);
        return {
          target: new THREE.Vector3(rightX * lateralShift, RIM_Y, rightZ * lateralShift),
          isBankAim: false,
          idealBankX: 0
        };
      }
    }

    function launchShot(powerRatio, tagLabel, tagColor, isPureGreen = false) {
      if (state.phase !== 'ready' && state.phase !== 'charging') return;

      if (state.mode === 'blitz' && !state.blitzStarted) {
        state.blitzStarted = true;
      }

      if (state.attempts >= 1) {
        elControlsHint.style.opacity = '0.52';
      }

      const releaseOrigin = new THREE.Vector3(state.shooterPos.x, 2.15, state.shooterPos.z);
      const aimData = computeCurrentAimTarget();
      const idealVel = computeIdealLaunchVelocity(releaseOrigin, aimData.target, state.launchDeg, state.windVec);

      shotBall.pos.copy(releaseOrigin);
      shotBall.vel.copy(idealVel).multiplyScalar(powerRatio);
      shotBall.omega.copy(getShooterBackspinVector(releaseOrigin));

      shotBall.flightTime = 0;
      shotBall.postResolveTimer = 0;
      shotBall.stuckTimer = 0;
      shotBall.maxY = releaseOrigin.y;
      shotBall.enteredCylinder = false;
      shotBall.scored = false;
      shotBall.invalidUnder = false;
      shotBall.touchedRim = false;
      shotBall.rimHits = 0;
      shotBall.touchedBackboard = false;
      shotBall.touchedFloor = false;
      shotBall.soundCooldown = 0;
      shotBall.isMoney = state.isMoneyBall;

      state.attempts++;
      state.phase = 'flight';

      // Show release tag feedback
      elReleaseTag.textContent = tagLabel;
      elReleaseTag.style.color = tagColor;
      elReleaseTag.style.borderColor = tagColor;
      elReleaseTag.classList.add('show');
      setTimeout(() => {
        if (state.phase === 'flight') elMeterWrap.classList.remove('visible');
        elReleaseTag.classList.remove('show');
      }, 650);

      sfx.playRelease(isPureGreen);
      updateHUD();
    }

    function spawnFloatingCallout(worldPos, text, color = '#ffbe2e', scale = 1.0) {
      const projected = worldPos.clone().project(camera);
      const sx = (projected.x * 0.5 + 0.5) * window.innerWidth;
      const sy = (-projected.y * 0.5 + 0.5) * window.innerHeight;

      const div = document.createElement('div');
      div.className = 'callout';
      div.textContent = text;
      div.style.left = `${sx}px`;
      div.style.top = `${sy}px`;
      div.style.color = color;
      div.style.fontSize = `${Math.round(25 * scale)}px`;
      elCalloutLayer.appendChild(div);
      setTimeout(() => div.remove(), 1200);
    }

    function onBasketScored(b) {
      const isSwish = !b.touchedRim && !b.touchedBackboard;
      const isCleanBank = b.touchedBackboard && !b.touchedRim;
      const isBuzzerBeater = state.mode === 'blitz' && state.buzzerTriggered;

      state.made++;
      state.streak++;
      if (state.streak > state.maxStreak) state.maxStreak = state.streak;
      if (isSwish) state.swishes++;

      const basePts = b.isMoney ? 2 : 1;
      const swishBonus = isSwish ? 1 : 0;
      const fireMult = state.mode === 'blitz' ? (state.streak >= 5 ? 3 : state.streak >= 3 ? 2 : 1) : 1;
      const buzzerBonus = isBuzzerBeater ? 3 : 0;
      const earned = (basePts + swishBonus) * fireMult + buzzerBonus;

      state.score += earned;
      if (state.score > bestScores[state.mode]) {
        bestScores[state.mode] = state.score;
        saveBestScores();
      }

      if (state.mode === 'freethrow' || state.mode === 'around') {
        state.shotResults[state.shotIndex] = isSwish ? 'swish' : 'made';
      }

      // Visual & Audio celebration!
      whipNetSwish(isSwish ? 1.35 : 0.75);
      sfx.playSwish(state.streak >= 3);

      state.ledFlashColor = 0xffbe2e;
      state.ledFlashTimer = 0.65;
      state.crowdExcitement = Math.min(1.5, 0.7 + state.streak * 0.22);
      if (isSwish || state.streak >= 3) state.camShake = 0.08;

      const hoopPos = new THREE.Vector3(0, 3.25, 0);
      spawnParticles(
        new THREE.Vector3(0, 2.95, 0),
        isSwish ? 36 : 20,
        state.streak >= 3 ? 0xff6a1a : (isSwish ? 0xffbe2e : 0x18e689),
        isSwish ? 3.4 : 2.3,
        -4.5
      );

      let label = `BUCKET! +${earned}`;
      let col = '#18e689';
      if (isBuzzerBeater) {
        label = `🚨 BUZZER BEATER! +${earned}`;
        col = '#ff3b5c';
      } else if (isSwish && b.isMoney) {
        label = `MONEY SWISH!! +${earned}`;
        col = '#ffbe2e';
      } else if (isSwish) {
        label = state.streak >= 3 ? `🔥 FIRE SWISH! +${earned}` : `PURE SWISH! +${earned}`;
        col = '#ffbe2e';
      } else if (isCleanBank) {
        label = `GLASS BANK! +${earned}`;
        col = '#38bdf8';
      } else if (b.rimHits >= 2) {
        label = `SHOOTER'S ROLL! +${earned}`;
        col = '#a7f3d0';
      }

      spawnFloatingCallout(hoopPos, label, col, isSwish || isBuzzerBeater ? 1.15 : 1.0);
      updateHUD();
      update3DScoreboard(isSwish ? 'SWISH!' : 'GOOD!');
    }

    function finalizeShotAttempt() {
      if (state.phase !== 'flight') return;

      if (!shotBall.scored) {
        state.streak = 0;
        if (state.mode === 'freethrow' || state.mode === 'around') {
          state.shotResults[state.shotIndex] = 'missed';
        }
        update3DScoreboard('MISS');
      }

      state.shotIndex++;
      handOffToGhostBall();
      prepareNextShot();
    }

    function finishRound() {
      state.phase = 'round_over';
      elMeterWrap.classList.remove('visible');

      const fgPct = state.attempts > 0 ? Math.round((state.made / state.attempts) * 100) : 0;
      document.getElementById('sum-score').textContent = state.score;
      document.getElementById('sum-fg').textContent = `${state.made}/${state.attempts} (${fgPct}%)`;
      document.getElementById('sum-swishes').textContent = state.swishes;
      document.getElementById('sum-streak').textContent = state.maxStreak;

      const modeNames = {
        freethrow: '10-Shot Free Throw Challenge',
        blitz: '60-Second Blitz Shootout',
        around: '5-Spot Around the Arc (15 Balls)',
        zen: 'Zen Practice Session'
      };
      document.getElementById('sum-sub').textContent = modeNames[state.mode];

      let rank = 'ROOKIE';
      if (fgPct >= 90 || state.score >= 24) rank = '🏆 HALL OF FAME (S+)';
      else if (fgPct >= 75 || state.score >= 17) rank = '★ ALL-STAR (A)';
      else if (fgPct >= 50 || state.score >= 10) rank = 'PRO STARTER (B)';
      document.getElementById('sum-rank').textContent = rank;

      elSummaryModal.classList.add('open');
      updateHUD();
      update3DScoreboard('FINAL');
    }

    function updateHUD() {
      elScore.textContent = state.score;
      const fgPct = state.attempts > 0 ? Math.round((state.made / state.attempts) * 100) : 0;
      elFg.textContent = `${fgPct}%`;

      if (state.streak >= 3) {
        elStreak.textContent = `🔥 ${state.streak}`;
        elStreak.classList.add('fire');
      } else {
        elStreak.textContent = state.streak;
        elStreak.classList.remove('fire');
      }

      elBest.textContent = bestScores[state.mode] || 0;
      elProgress.classList.remove('clock-warn');

      if (state.mode === 'freethrow') {
        elProgressLbl.textContent = 'Shot';
        elProgress.textContent = `${Math.min(10, state.shotIndex + 1)} / 10`;
        renderShotPips(10);
      } else if (state.mode === 'around') {
        const spotIdx = Math.min(4, Math.floor(state.shotIndex / 3));
        elProgressLbl.textContent = FIVE_SPOTS[spotIdx].name;
        elProgress.textContent = `${Math.min(15, state.shotIndex + 1)} / 15`;
        renderShotPips(15);
      } else if (state.mode === 'blitz') {
        elProgressLbl.textContent = 'Clock';
        elProgress.textContent = state.blitzTime.toFixed(1) + 's';
        if (state.blitzTime <= 10 && state.blitzTime > 0) elProgress.classList.add('clock-warn');
        elShotPips.style.display = 'none';
      } else {
        elProgressLbl.textContent = 'Made';
        elProgress.textContent = `${state.made} / ${state.attempts}`;
        elShotPips.style.display = 'none';
      }
    }

    function renderShotPips(total) {
      elShotPips.style.display = 'flex';
      elShotPips.innerHTML = '';
      for (let i = 0; i < total; i++) {
        const d = document.createElement('div');
        d.className = 'pip';
        if (isShotMoneyBall(state.mode, i)) d.classList.add('money');
        const res = state.shotResults[i];
        if (res === 'swish') d.classList.add('swish');
        else if (res === 'made') d.classList.add('made');
        else if (res === 'missed') d.classList.add('missed');
        else if (i === state.shotIndex && state.phase !== 'round_over') d.classList.add('current');
        elShotPips.appendChild(d);
      }
    }

    function update3DScoreboard(bannerText = '') {
      const ctx = ledBoardCtx;
      ctx.fillStyle = '#070b12';
      ctx.fillRect(0, 0, 512, 220);

      ctx.strokeStyle = state.streak >= 3 ? '#ff621f' : '#2a3b5c';
      ctx.lineWidth = 6;
      ctx.strokeRect(6, 6, 500, 208);

      // Left: SCORE
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 22px Inter, sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText('SCORE', 28, 42);
      ctx.fillStyle = '#ffbe2e';
      ctx.font = '900 72px monospace';
      ctx.fillText(String(state.score).padStart(2, '0'), 26, 118);

      // Center: CLOCK or SHOT
      ctx.textAlign = 'center';
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 22px Inter, sans-serif';
      ctx.fillText(state.mode === 'blitz' ? 'CLOCK' : 'STREAK', 256, 42);
      ctx.fillStyle = state.mode === 'blitz' && state.blitzTime <= 10 ? '#ff3b5c' : '#ff5a1f';
      ctx.font = '900 68px monospace';
      const midVal = state.mode === 'blitz' ? state.blitzTime.toFixed(0) : `x${state.streak}`;
      ctx.fillText(midVal, 256, 116);

      // Right: FG%
      const fg = state.attempts > 0 ? Math.round((state.made / state.attempts) * 100) : 0;
      ctx.textAlign = 'right';
      ctx.fillStyle = '#94a3b8';
      ctx.font = '700 22px Inter, sans-serif';
      ctx.fillText('FG%', 484, 42);
      ctx.fillStyle = '#18e689';
      ctx.font = '900 62px monospace';
      ctx.fillText(`${fg}%`, 484, 114);

      // Bottom ticker
      ctx.fillStyle = '#111b2e';
      ctx.fillRect(14, 146, 484, 56);
      ctx.textAlign = 'center';
      ctx.fillStyle = bannerText === 'SWISH!' ? '#ffbe2e' : '#f8fafc';
      ctx.font = '900 32px Inter, sans-serif';
      const bottomMsg = bannerText || (state.streak >= 3 ? '🔥 SHOOTER ON FIRE 🔥' : (state.isMoneyBall ? '★ MONEY BALL WORTH 2X ★' : 'PRO HOOPS ARENA'));
      ctx.fillText(bottomMsg, 256, 185);

      ledBoardTex.needsUpdate = true;
    }

    // =========================================================================
    // INPUT HANDLING (Mouse Aim + Hold Shot Meter + Quick Upward Flick + Keys)
    // =========================================================================
    const pointer = {
      down: false,
      downX: 0,
      downY: 0,
      curX: window.innerWidth * 0.5,
      curY: window.innerHeight * 0.5,
      downTime: 0
    };
    let spaceHeld = false;

    function updateAimFromScreen(clientX, clientY) {
      // Project Hoop Center (0, 3.05, 0) to screen so aiming works intuitively from ANY camera angle!
      const hoopScreen = new THREE.Vector3(0, RIM_Y, 0).project(camera);
      const hx = (hoopScreen.x * 0.5 + 0.5) * window.innerWidth;
      const hy = (-hoopScreen.y * 0.5 + 0.5) * window.innerHeight;

      const nx = THREE.MathUtils.clamp((clientX - hx) / (window.innerWidth * 0.28), -1, 1);
      // Smooth precision curve around hoop center
      const curvedX = Math.sign(nx) * (0.42 * Math.abs(nx) + 0.58 * nx * nx);
      state.aimYawOffset = curvedX * 0.21;

      // Vertical relative to hoop: aiming above hoop raises arc or targets backboard glass!
      const dyNorm = (hy - clientY) / (window.innerHeight * 0.26); // positive when cursor is ABOVE hoop
      if (dyNorm > 0.36) {
        state.bankAimFactor = THREE.MathUtils.clamp((dyNorm - 0.36) / 0.55, 0, 1);
        state.launchDeg = 52.5;
      } else {
        state.bankAimFactor = 0;
        state.launchDeg = THREE.MathUtils.clamp(54.0 + dyNorm * 14.0, 47.5, 62.5);
      }
    }

    canvas.addEventListener('pointermove', (e) => {
      pointer.curX = e.clientX;
      pointer.curY = e.clientY;
      if (state.phase === 'ready' || state.phase === 'charging') {
        updateAimFromScreen(e.clientX, e.clientY);
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 && e.pointerType === 'mouse') return;
      sfx.unlock();

      if (state.phase === 'round_over') return;

      // Rapid-fire convenience: if previous shot already missed and hit the floor, ready immediately!
      if (state.phase === 'flight' && (shotBall.touchedFloor || (shotBall.scored && shotBall.pos.y < 2.3))) {
        finalizeShotAttempt();
      }

      if (state.phase === 'ready') {
        pointer.down = true;
        pointer.downX = e.clientX;
        pointer.downY = e.clientY;
        pointer.curX = e.clientX;
        pointer.curY = e.clientY;
        pointer.downTime = performance.now();
        updateAimFromScreen(e.clientX, e.clientY);

        state.phase = 'charging';
        state.meterVal = 0.04;
        state.meterDir = 1;
        elMeterWrap.classList.add('visible');
        elMeterTick.style.opacity = '0';
      }
    });

    window.addEventListener('pointerup', (e) => {
      if (!pointer.down) return;
      pointer.down = false;
      if (state.phase !== 'charging') return;

      const dtMs = performance.now() - pointer.downTime;
      const dx = e.clientX - pointer.downX;
      const dy = e.clientY - pointer.downY;

      // Support natural quick UPWARD FLICK (< 290ms & upward swipe > 55px)!
      if (dtMs < 290 && dy < -55) {
        const upDist = -dy;
        const velFactor = (upDist / Math.max(60, dtMs)) * 0.92; // ~1.0 for natural flick
        const distFactor = upDist / 185;
        const blended = 0.55 * velFactor + 0.45 * distFactor;
        const powerRatio = THREE.MathUtils.clamp(0.92 + (blended - 0.92) * 0.24, 0.85, 1.15);

        const baseAngle = Math.atan2(-state.shooterPos.x, -state.shooterPos.z);
        const swipeYaw = THREE.MathUtils.clamp((dx / upDist) * 0.24, -0.18, 0.18);
        state.aimYawOffset = swipeYaw;
        state.bankAimFactor = 0;

        const isGreatFlick = Math.abs(powerRatio - 1.0) < 0.024;
        launchShot(isGreatFlick ? 1.0 : powerRatio, isGreatFlick ? 'PURE FLICK!' : 'FLICK SHOT', isGreatFlick ? '#18e689' : '#38bdf8', isGreatFlick);
        return;
      }

      // Guard against accidental tiny focus tap (< 95ms without flick)
      if (dtMs < 95) {
        state.phase = 'ready';
        state.meterVal = 0;
        elMeterWrap.classList.remove('visible');
        return;
      }

      releaseFromMeter();
    });

    function releaseFromMeter() {
      const m = state.meterVal;
      elMeterTick.style.bottom = `${(m * 100).toFixed(1)}%`;
      elMeterTick.style.opacity = '1';

      const err = m - SWEET_SPOT;
      let powerRatio, label, color, isGreen = false;

      if (Math.abs(err) <= 0.030) {
        // Pure Green Window!
        powerRatio = 1.0 + err * 0.10;
        label = 'PERFECT GREEN!';
        color = '#18e689';
        isGreen = true;
      } else if (Math.abs(err) <= 0.075) {
        powerRatio = 1.0 + err * 0.42;
        label = err < 0 ? 'GOOD (SLIGHT EARLY)' : 'GOOD (SLIGHT LATE)';
        color = '#ffbe2e';
      } else {
        powerRatio = 1.0 + err * 0.55;
        label = err < 0 ? 'EARLY (SHORT)' : 'LATE (STRONG)';
        color = '#ff3b5c';
      }

      launchShot(powerRatio, label, color, isGreen);
    }

    // Keyboard Controls
    const keysDown = {};
    window.addEventListener('keydown', (e) => {
      keysDown[e.code] = true;
      sfx.unlock();

      if (e.code === 'Space') {
        e.preventDefault();
        if (state.phase === 'round_over') {
          startMode(state.mode);
          return;
        }
        if (!spaceHeld) {
          spaceHeld = true;
          if (state.phase === 'flight' && (shotBall.touchedFloor || (shotBall.scored && shotBall.pos.y < 2.3))) {
            finalizeShotAttempt();
          }
          if (state.phase === 'ready') {
            state.phase = 'charging';
            state.meterVal = 0.04;
            state.meterDir = 1;
            elMeterWrap.classList.add('visible');
            elMeterTick.style.opacity = '0';
          }
        }
      } else if (e.code === 'Enter' && state.phase === 'round_over') {
        startMode(state.mode);
      } else if (e.code === 'KeyC') {
        cycleCamera();
      } else if (e.code === 'KeyG') {
        cycleArcGuide();
      } else if (e.code === 'KeyV') {
        toggleWind();
      } else if (e.code === 'KeyM') {
        toggleSound();
      } else if (e.code === 'KeyR') {
        startMode(state.mode);
      } else if (e.code === 'Digit1') startMode('freethrow');
      else if (e.code === 'Digit2') startMode('blitz');
      else if (e.code === 'Digit3') startMode('around');
      else if (e.code === 'Digit4') startMode('zen');
    });

    window.addEventListener('keyup', (e) => {
      keysDown[e.code] = false;
      if (e.code === 'Space' && spaceHeld) {
        spaceHeld = false;
        if (state.phase === 'charging') {
          releaseFromMeter();
        }
      }
    });

    // HUD Buttons
    document.getElementById('mode-switcher').addEventListener('click', (e) => {
      const btn = e.target.closest('.mode-btn');
      if (!btn) return;
      sfx.unlock();
      startMode(btn.dataset.mode);
    });

    function cycleCamera() {
      state.camMode = (state.camMode + 1) % 4;
      const names = ['Shooter Cam', 'Broadcast High', 'Side Baseline', 'Action Follow'];
      document.getElementById('lbl-cam').textContent = names[state.camMode];
    }

    function cycleArcGuide() {
      state.arcMode = (state.arcMode + 1) % 3;
      const names = ['Guide: Off', 'Guide: Pro', 'Guide: Full'];
      document.getElementById('lbl-arc').textContent = names[state.arcMode];
      document.getElementById('btn-arc').classList.toggle('toggled', state.arcMode > 0);
    }

    function toggleWind() {
      state.windEnabled = !state.windEnabled;
      document.getElementById('lbl-wind').textContent = state.windEnabled ? 'Wind: On' : 'Wind: Off';
      document.getElementById('btn-wind').classList.toggle('toggled', state.windEnabled);
      refreshWindForShot();
    }

    function toggleSound() {
      sfx.enabled = !sfx.enabled;
      document.getElementById('lbl-sound').textContent = sfx.enabled ? 'SFX' : 'Muted';
      document.getElementById('btn-sound').classList.toggle('toggled', sfx.enabled);
    }

    document.getElementById('btn-cam').addEventListener('click', () => { sfx.unlock(); cycleCamera(); });
    document.getElementById('btn-arc').addEventListener('click', () => { sfx.unlock(); cycleArcGuide(); });
    document.getElementById('btn-wind').addEventListener('click', () => { sfx.unlock(); toggleWind(); });
    document.getElementById('btn-sound').addEventListener('click', () => { toggleSound(); });
    document.getElementById('btn-reset').addEventListener('click', () => { sfx.unlock(); startMode(state.mode); });
    document.getElementById('btn-play-again').addEventListener('click', () => { sfx.unlock(); startMode(state.mode); });

    // =========================================================================
    // AIM PREVIEW ARC, CAMERA CHOREOGRAPHY & MAIN ANIMATION LOOP
    // =========================================================================
    const camCurrentPos = new THREE.Vector3(0, 2.45, 7.15);
    const camCurrentLook = new THREE.Vector3(0, 2.75, 0.2);

    function updateAimArcVisuals(time) {
      const showGuide = (state.phase === 'ready' || state.phase === 'charging') && state.arcMode > 0;
      if (!showGuide) {
        arcDots.forEach((d) => { d.visible = false; });
        aimTargetRing.visible = false;
        bankSweetMesh.material.opacity = 0;
        elAimInfo.style.opacity = '0';
        return;
      }

      const releaseOrigin = new THREE.Vector3(state.shooterPos.x, 2.15, state.shooterPos.z);
      const aimData = computeCurrentAimTarget();
      const previewPower = state.phase === 'charging'
        ? 1.0 + (state.meterVal - SWEET_SPOT) * 0.5
        : 1.0;

      const v0 = computeIdealLaunchVelocity(releaseOrigin, aimData.target, state.launchDeg, state.windVec)
        .multiplyScalar(previewPower);
      const omega = getShooterBackspinVector(releaseOrigin);

      let px = releaseOrigin.x, py = releaseOrigin.y, pz = releaseOrigin.z;
      let vx = v0.x, vy = v0.y, vz = v0.z;

      const visibleCount = state.arcMode === 2 ? MAX_ARC_DOTS : 13;
      const stepDt = 0.036;

      for (let i = 0; i < MAX_ARC_DOTS; i++) {
        const dot = arcDots[i];
        if (i >= visibleCount) {
          dot.visible = false;
          continue;
        }
        // Advance trajectory preview with drag, Magnus spin & wind
        for (let sub = 0; sub < 3; sub++) {
          const dt = stepDt / 3;
          const rvx = vx - state.windVec.x, rvy = vy, rvz = vz - state.windVec.z;
          const sp = Math.hypot(rvx, rvy, rvz);
          vx -= AIR_DRAG * sp * rvx * dt;
          vy += (GRAVITY - AIR_DRAG * sp * rvy) * dt;
          vz -= AIR_DRAG * sp * rvz * dt;
          const magScale = 0.0018;
          vx += (omega.y * vz - omega.z * vy) * magScale * dt;
          vy += (omega.z * vx - omega.x * vz) * magScale * dt;
          vz += (omega.x * vy - omega.y * vx) * magScale * dt;
          px += vx * dt; py += vy * dt; pz += vz * dt;
        }

        dot.position.set(px, py, pz);
        const fade = 1 - i / (visibleCount + 1);
        dot.scale.setScalar(0.65 + fade * 0.55);
        dot.material.opacity = fade * 0.82;

        if (state.phase === 'charging' && Math.abs(state.meterVal - SWEET_SPOT) <= 0.032) {
          dot.material.color.setHex(0x18e689);
        } else if (aimData.isBankAim) {
          dot.material.color.setHex(0x38bdf8);
        } else {
          dot.material.color.setHex(0xffffff);
        }
        dot.visible = py > 0.15 && pz > BOARD_Z - 0.1;
      }

      // Target reticle on hoop plane or glass backboard
      aimTargetRing.visible = true;
      aimTargetRing.position.copy(aimData.target);
      if (aimData.isBankAim) {
        aimTargetRing.rotation.set(0, 0, 0);
        aimTargetRing.material.color.setHex(0x38bdf8);
        bankSweetMesh.position.set(aimData.idealBankX, 3.40, BOARD_Z + 0.006);
        bankSweetMesh.material.opacity = 0.45 + 0.25 * Math.sin(time * 6);
      } else {
        aimTargetRing.rotation.set(-Math.PI * 0.5, 0, 0);
        aimTargetRing.material.color.setHex(0x18e689);
        bankSweetMesh.material.opacity = 0;
      }

      // Small contextual label near aim target
      const proj = aimData.target.clone().project(camera);
      elAimInfo.style.left = `${(proj.x * 0.5 + 0.5) * window.innerWidth}px`;
      elAimInfo.style.top = `${(-proj.y * 0.5 + 0.5) * window.innerHeight}px`;
      elAimInfo.textContent = aimData.isBankAim
        ? `BANK GLASS • ${Math.round(state.launchDeg)}°`
        : `ARC ${Math.round(state.launchDeg)}°`;
      elAimInfo.style.opacity = '0.9';
    }

    function updateCamera(dt, time) {
      const sx = state.shooterPos.x, sz = state.shooterPos.z;
      const dist = Math.hypot(sx, sz) || 1;
      const dirX = sx / dist, dirZ = sz / dist; // unit vector from hoop (0,0) toward shooter

      const targetPos = new THREE.Vector3();
      const targetLook = new THREE.Vector3(0, 2.75, 0.15);

      if (state.camMode === 0 || state.camMode === 3) {
        // Shooter perspective behind the shooting spot
        targetPos.set(sx + dirX * 2.85, 2.48, sz + dirZ * 2.85);
        targetLook.set(sx * 0.14, 2.78, sz * 0.12);

        // Subtle mouse parallax
        targetPos.x += state.aimYawOffset * 0.65;

        // Action Follow rise during flight
        if (state.camMode === 3 && state.phase === 'flight') {
          targetPos.lerp(new THREE.Vector3(sx * 0.55, 3.25, sz * 0.55 + 1.4), 0.38);
          targetLook.lerp(shotBall.pos, 0.35);
        } else if (state.phase === 'flight') {
          targetPos.y += 0.16;
          targetLook.y = THREE.MathUtils.lerp(2.78, Math.min(3.5, shotBall.pos.y * 0.4 + 1.8), 0.35);
        }
      } else if (state.camMode === 1) {
        // High Broadcast View
        targetPos.set(sx * 0.7 + dirX * 4.6, 4.55, sz * 0.7 + dirZ * 4.6);
        targetLook.set(0, 2.55, 0.6);
      } else {
        // Dramatic Courtside / Baseline Angle
        const sideSign = sx < -0.5 ? -1 : 1;
        targetPos.set(sideSign * 5.8, 2.35, 2.45);
        targetLook.set(0, 2.75, 1.1);
      }

      // Subtle camera breathing & impact shake
      targetPos.y += Math.sin(time * 1.6) * 0.012;
      if (state.camShake > 0.001) {
        targetPos.x += (Math.random() - 0.5) * state.camShake;
        targetPos.y += (Math.random() - 0.5) * state.camShake;
        state.camShake *= Math.pow(0.04, dt);
      }

      const smooth = 1 - Math.pow(0.0015, dt);
      camCurrentPos.lerp(targetPos, smooth);
      camCurrentLook.lerp(targetLook, smooth);

      camera.position.copy(camCurrentPos);
      camera.lookAt(camCurrentLook);
    }

    function updateShotMeterPosition() {
      if (!elMeterWrap.classList.contains('visible')) return;
      const ballWorld = playerBallMesh.position.clone();
      ballWorld.y += 0.08;
      const proj = ballWorld.project(camera);
      const sx = THREE.MathUtils.clamp((proj.x * 0.5 + 0.5) * window.innerWidth, 80, window.innerWidth - 130);
      const sy = THREE.MathUtils.clamp((-proj.y * 0.5 + 0.5) * window.innerHeight, 120, window.innerHeight - 110);
      elMeterWrap.style.left = `${sx}px`;
      elMeterWrap.style.top = `${sy}px`;
      elMeterFill.style.height = `${(state.meterVal * 100).toFixed(1)}%`;
    }

    let lastTime = performance.now();
    const dummyCrowdObj = new THREE.Object3D();

    function animate(now) {
      requestAnimationFrame(animate);
      const rawDt = (now - lastTime) * 0.001;
      lastTime = now;
      const dt = Math.min(rawDt, 0.05);
      const time = now * 0.001;

      // Keyboard fine-tuning for aim/arc
      if (state.phase === 'ready' || state.phase === 'charging') {
        if (keysDown['ArrowLeft'] || keysDown['KeyA']) state.aimYawOffset = Math.max(-0.22, state.aimYawOffset - 0.32 * dt);
        if (keysDown['ArrowRight'] || keysDown['KeyD']) state.aimYawOffset = Math.min(0.22, state.aimYawOffset + 0.32 * dt);
        if (keysDown['ArrowUp'] || keysDown['KeyW']) state.launchDeg = Math.min(63, state.launchDeg + 14 * dt);
        if (keysDown['ArrowDown'] || keysDown['KeyS']) state.launchDeg = Math.max(47, state.launchDeg - 14 * dt);
      }

      // 60s Blitz Countdown + True NBA Buzzer-Beater Handling!
      if (state.mode === 'blitz' && state.blitzStarted && state.phase !== 'round_over') {
        if (state.blitzTime > 0) {
          const prevSec = Math.ceil(state.blitzTime);
          state.blitzTime = Math.max(0, state.blitzTime - dt);
          const curSec = Math.ceil(state.blitzTime);
          if (curSec !== prevSec) {
            updateHUD();
            update3DScoreboard();
          } else {
            elProgress.textContent = state.blitzTime.toFixed(1) + 's';
          }

          if (state.blitzTime <= 0 && !state.buzzerTriggered) {
            state.buzzerTriggered = true;
            sfx.playBuzzer();
            state.ledFlashColor = 0xff1e38;
            state.ledFlashTimer = 2.5;
            updateHUD();
            update3DScoreboard('0.0 BUZZER');

            // If no shot is mid-air, end immediately; otherwise let buzzer-beater finish!
            if (state.phase !== 'flight') {
              finishRound();
            } else {
              spawnFloatingCallout(new THREE.Vector3(0, 3.7, 0), '🚨 BUZZER SHOT IN AIR!', '#ff3b5c', 1.0);
            }
          }
        }
      }

      // Rim breakaway spring oscillation
      const springForce = -145 * rimFlexAngle - 14 * rimFlexVel;
      rimFlexVel += springForce * dt;
      rimFlexAngle = Math.max(0, rimFlexAngle + rimFlexVel * dt);
      rimPivot.rotation.x = rimFlexAngle;

      // Backboard LED perimeter glow
      if (state.ledFlashTimer > 0) {
        state.ledFlashTimer -= dt;
        boardLedMat.color.setHex(state.ledFlashColor);
      } else if (state.streak >= 3) {
        const pulse = 0.55 + 0.45 * Math.sin(time * 8);
        boardLedMat.color.setRGB(1.0 * pulse, 0.36 * pulse, 0.08 * pulse);
      } else {
        boardLedMat.color.setHex(0x1c2c4c);
      }

      // Primary Ball State Machine
      if (state.phase === 'ready') {
        const bob = Math.sin(time * 2.8) * 0.025;
        shotBall.pos.set(state.shooterPos.x, 1.92 + bob, state.shooterPos.z);
        playerBallMesh.position.copy(shotBall.pos);
        playerBallMesh.rotation.y += dt * 0.65;
      } else if (state.phase === 'charging') {
        // Smooth 0.90s sweep to 100% (Green Sweet Spot at 0.76 = ~0.68s)
        state.meterVal += state.meterDir * (dt / 0.90);
        if (state.meterVal >= 1.0) {
          state.meterVal = 1.0;
          state.meterDir = -1;
        } else if (state.meterVal <= 0.05) {
          state.meterVal = 0.05;
          state.meterDir = 1;
        }

        // Smoothly elevate ball from triple-threat to shooter's release set-point!
        const lift = THREE.MathUtils.smoothstep(state.meterVal, 0, SWEET_SPOT);
        shotBall.pos.set(state.shooterPos.x, 1.88 + lift * 0.27, state.shooterPos.z);
        playerBallMesh.position.copy(shotBall.pos);
        playerBallMesh.rotation.x -= dt * 3.2;
        updateShotMeterPosition();
      } else if (state.phase === 'flight') {
        shotBall.flightTime += dt;
        const SUBSTEPS = 8;
        const subDt = dt / SUBSTEPS;
        for (let s = 0; s < SUBSTEPS; s++) {
          stepBallSubstep(shotBall, subDt, state.windVec, true);
        }

        playerBallMesh.position.copy(shotBall.pos);
        const omegaLen = shotBall.omega.length();
        if (omegaLen > 0.01) {
          const axis = shotBall.omega.clone().divideScalar(omegaLen);
          playerBallMesh.rotateOnWorldAxis(axis, omegaLen * dt);
        }

        // Flight trail particles (white air stream normally; fiery embers when Streak >= 3!)
        if (shotBall.pos.y > 1.2 && Math.random() < (state.streak >= 3 ? 0.9 : 0.45)) {
          spawnParticles(
            shotBall.pos,
            state.streak >= 3 ? 2 : 1,
            state.streak >= 3 ? 0xff6619 : (shotBall.isMoney ? 0x60a5fa : 0xe2e8f0),
            state.streak >= 3 ? 0.55 : 0.22,
            state.streak >= 3 ? 1.2 : -0.5
          );
        }

        // Anti-wedgie guard if ball stalls on bracket/rim
        if (shotBall.pos.y > 2.8 && shotBall.vel.length() < 0.28) {
          shotBall.stuckTimer += dt;
          if (shotBall.stuckTimer > 1.0) {
            shotBall.vel.z += 1.4;
            shotBall.vel.y += 0.8;
          }
        } else {
          shotBall.stuckTimer = 0;
        }

        // Decide when shot attempt is resolved so gameplay stays snappy!
        const outOfBounds = Math.abs(shotBall.pos.x) > 7.8 || shotBall.pos.z < -2.8 || shotBall.pos.z > 12.5;
        const clearedAfterScore = shotBall.scored && (shotBall.pos.y < 1.55 || shotBall.touchedFloor);
        const missedAndSettled = !shotBall.scored && shotBall.touchedFloor && shotBall.pos.y < 1.25;

        if (clearedAfterScore || missedAndSettled || outOfBounds || shotBall.flightTime > 4.6) {
          shotBall.postResolveTimer += dt;
          const waitNeeded = state.mode === 'blitz' ? 0.16 : 0.36;
          if (shotBall.postResolveTimer >= waitNeeded || outOfBounds || shotBall.flightTime > 4.6) {
            finalizeShotAttempt();
          }
        }
      }

      // Step rolling/bouncing court ghost balls
      const activeNetBalls = state.phase === 'flight' ? [shotBall] : [];
      ghostBalls.forEach((gb) => {
        if (!gb.active) return;
        gb.age += dt;
        if (gb.age > 3.2 || Math.abs(gb.pos.x) > 9.5 || gb.pos.z < -3.4 || gb.pos.z > 15) {
          gb.active = false;
          gb.mesh.visible = false;
          return;
        }
        const subDt = dt / 4;
        for (let s = 0; s < 4; s++) {
          stepBallSubstep(gb, subDt, state.windVec, false);
        }
        gb.mesh.position.copy(gb.pos);
        const wLen = gb.omega.length();
        if (wLen > 0.01) {
          gb.mesh.rotateOnWorldAxis(gb.omega.clone().divideScalar(wLen), wLen * dt);
        }
        activeNetBalls.push(gb);
      });

      // Step 3D Cloth Net physics
      stepNetPhysics(dt, activeNetBalls, state.windVec);

      // Update Fire Aura & Floor Contact Shadow
      const targetAura = state.streak >= 3 ? (0.26 + 0.08 * Math.sin(time * 14)) : 0;
      fireAuraMesh.material.opacity += (targetAura - fireAuraMesh.material.opacity) * Math.min(1, dt * 8);

      ballFloorShadow.position.x = playerBallMesh.position.x;
      ballFloorShadow.position.z = playerBallMesh.position.z;
      const hFactor = THREE.MathUtils.clamp(1 - (playerBallMesh.position.y - BALL_RADIUS) / 4.5, 0.18, 1.0);
      ballFloorShadow.scale.setScalar(1.35 - hFactor * 0.48);
      ballFloorShadow.material.opacity = hFactor * 0.85;

      // Step Burst & Trail Particles
      let pDirty = false;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const p = pState[i];
        if (!p.active) continue;
        pDirty = true;
        p.life += dt;
        if (p.life >= p.maxLife) {
          p.active = false;
          pPositions[i * 3 + 1] = -999;
          continue;
        }
        p.vy += p.gravity * dt;
        pPositions[i * 3]     += p.vx * dt;
        pPositions[i * 3 + 1] += p.vy * dt;
        pPositions[i * 3 + 2] += p.vz * dt;
      }
      if (pDirty) particleGeo.attributes.position.needsUpdate = true;

      // Drift ambient dust motes (shows crosswind visually!)
      for (let i = 0; i < MOTE_COUNT; i++) {
        let mx = motePositions[i * 3]     + (state.windVec.x * 0.65 + Math.sin(time + i) * 0.06) * dt;
        let my = motePositions[i * 3 + 1] + Math.cos(time * 0.7 + i) * 0.04 * dt;
        let mz = motePositions[i * 3 + 2] + (state.windVec.z * 0.65 + Math.cos(time + i) * 0.06) * dt;
        if (mx > 7) mx = -7; if (mx < -7) mx = 7;
        if (mz > 8) mz = -2; if (mz < -2) mz = 8;
        motePositions[i * 3] = mx;
        motePositions[i * 3 + 1] = my;
        motePositions[i * 3 + 2] = mz;
      }
      moteGeo.attributes.position.needsUpdate = true;
      moteMat.opacity = state.windEnabled ? 0.52 : 0.2;

      // Animate Instanced Arena Crowd when excited / on a streak!
      if (state.crowdExcitement > 0.01 || state.streak >= 3) {
        const amp = Math.max(state.crowdExcitement * 0.14, state.streak >= 3 ? 0.08 : 0);
        for (let i = 0; i < crowdData.length; i++) {
          const c = crowdData[i];
          const bounce = Math.abs(Math.sin(time * 8.5 + c.phase)) * amp;
          dummyCrowdObj.position.set(c.basePos.x, c.basePos.y + bounce, c.basePos.z);
          dummyCrowdObj.scale.setScalar(c.scale);
          dummyCrowdObj.updateMatrix();
          crowdInstanced.setMatrixAt(i, dummyCrowdObj.matrix);
        }
        crowdInstanced.instanceMatrix.needsUpdate = true;
        state.crowdExcitement = Math.max(0, state.crowdExcitement - dt * 0.65);
      }

      updateCamera(dt, time);
      updateAimArcVisuals(time);

      renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Initialize directly into playable 10-Shot Free Throw Challenge!
    startMode('freethrow');
    requestAnimationFrame(animate);
  </script>
</body>
</html>
