<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PRO HOOPS 3D — Interactive Basketball Free Throw</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --glass-bg: rgba(11, 17, 30, 0.78);
      --glass-border: rgba(255, 255, 255, 0.13);
      --accent-orange: #ff621f;
      --accent-gold: #ffbe2e;
      --accent-green: #18e689;
      --accent-cyan: #38bdf8;
      --accent-red: #ff3b5c;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg-dark);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      color: var(--text-main);
      touch-action: none;
    }

    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
      touch-action: none;
    }

    /* HUD Overlay */
    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 14px 18px;
      z-index: 10;
    }

    .ui-interactive {
      pointer-events: auto;
    }

    /* Top Broadcast Scorebug */
    .top-bar {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .mode-switcher {
      display: flex;
      gap: 6px;
      background: rgba(8, 12, 24, 0.82);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 4px;
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      flex-wrap: wrap;
      justify-content: center;
    }

    .mode-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 11.5px;
      font-weight: 700;
      letter-spacing: 0.06em;
      padding: 6px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: all 0.18s ease;
      text-transform: uppercase;
    }

    .mode-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.07);
    }

    .mode-btn.active {
      background: linear-gradient(135deg, #ff6a26, #e63e00);
      color: #fff;
      box-shadow: 0 2px 12px rgba(255, 98, 31, 0.5);
    }

    .scorebug {
      display: flex;
      align-items: stretch;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.52);
    }

    .sb-cell {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border-right: 1px solid rgba(255, 255, 255, 0.09);
      min-width: 78px;
    }

    .sb-cell:last-child {
      border-right: none;
    }

    .sb-cell.highlight {
      background: linear-gradient(180deg, rgba(255, 98, 31, 0.2), rgba(255, 98, 31, 0.04));
    }

    .sb-label {
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .sb-val {
      font-size: 22px;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      line-height: 1.1;
      color: #fff;
    }

    .sb-val.gold {
      color: var(--accent-gold);
    }

    .sb-val.fire {
      color: #ff7733;
      text-shadow: 0 0 12px rgba(255, 102, 25, 0.8);
    }

    .sb-val.clock-warn {
      color: var(--accent-red);
      animation: pulseWarn 0.5s infinite alternate;
    }

    @keyframes pulseWarn {
      from { transform: scale(1); text-shadow: 0 0 6px rgba(255, 59, 92, 0.5); }
      to { transform: scale(1.08); text-shadow: 0 0 18px rgba(255, 59, 92, 0.95); }
    }

    /* Shot Pips & Wind Row */
    .status-strip {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 24px;
    }

    .shot-pips {
      display: flex;
      gap: 5px;
      align-items: center;
      background: rgba(9, 14, 26, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 5px 11px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .pip {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      border: 1px solid rgba(255, 255, 255, 0.25);
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .pip.money {
      border-color: var(--accent-gold);
      box-shadow: 0 0 6px rgba(255, 190, 46, 0.55);
    }

    .pip.current {
      transform: scale(1.32);
      border-color: #fff;
      background: rgba(255, 255, 255, 0.5);
    }

    .pip.made {
      background: var(--accent-green);
      border-color: var(--accent-green);
      box-shadow: 0 0 8px rgba(24, 230, 137, 0.7);
    }

    .pip.swish {
      background: var(--accent-gold);
      border-color: #fff;
      box-shadow: 0 0 10px rgba(255, 190, 46, 0.9);
    }

    .pip.missed {
      background: rgba(255, 59, 92, 0.65);
      border-color: var(--accent-red);
    }

    .wind-badge {
      display: none;
      align-items: center;
      gap: 6px;
      background: rgba(14, 24, 42, 0.82);
      border: 1px solid rgba(56, 189, 248, 0.35);
      color: var(--accent-cyan);
      font-size: 11.5px;
      font-weight: 700;
      padding: 4px 11px;
      border-radius: 999px;
      backdrop-filter: blur(8px);
    }

    .wind-badge.visible {
      display: flex;
    }

    .wind-arrow {
      display: inline-block;
      font-size: 13px;
      transition: transform 0.3s ease;
    }

    /* Dynamic Shot Meter near ball */
    #shot-meter-wrap {
      position: fixed;
      left: 50%;
      top: 68%;
      transform: translate(46px, -50%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.16s ease;
      z-index: 15;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #shot-meter-wrap.visible {
      opacity: 1;
    }

    .meter-track {
      width: 15px;
      height: 136px;
      background: rgba(8, 12, 22, 0.86);
      border: 1.5px solid rgba(255, 255, 255, 0.25);
      border-radius: 999px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }

    .meter-good-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 69%;
      height: 14%;
      background: rgba(255, 190, 46, 0.28);
    }

    .meter-green-zone {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 73.2%;
      height: 5.6%;
      background: var(--accent-green);
      box-shadow: 0 0 10px var(--accent-green);
    }

    .meter-fill {
      position: absolute;
      left: 1px;
      right: 1px;
      bottom: 1px;
      height: 0%;
      border-radius: 999px;
      background: linear-gradient(0deg, #38bdf8 0%, #ff8c24 68%, #18e689 76%, #ff3b5c 96%);
      transition: none;
    }

    .meter-tick {
      position: absolute;
      left: -3px;
      right: -3px;
      height: 3px;
      background: #fff;
      box-shadow: 0 0 8px #fff;
      bottom: 0%;
      opacity: 0;
    }

    .release-tag {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.05em;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(8, 12, 22, 0.88);
      border: 1px solid rgba(255, 255, 255, 0.18);
      white-space: nowrap;
      opacity: 0;
      transform: translateX(-4px);
      transition: all 0.15s ease;
    }

    .release-tag.show {
      opacity: 1;
      transform: translateX(0);
    }

    /* Aim Reticle Indicator */
    #aim-hud-info {
      position: fixed;
      pointer-events: none;
      font-size: 10.5px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.78);
      background: rgba(9, 14, 25, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.14);
      padding: 3px 8px;
      border-radius: 6px;
      transform: translate(-50%, -150%);
      opacity: 0;
      transition: opacity 0.2s ease;
      z-index: 12;
      white-space: nowrap;
    }

    /* Floating Callouts */
    #callout-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 20;
      overflow: hidden;
    }

    .callout {
      position: absolute;
      transform: translate(-50%, -50%) scale(0.7);
      font-weight: 900;
      font-size: 26px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.75);
      animation: calloutFloat 1.15s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
      white-space: nowrap;
    }

    @keyframes calloutFloat {
      0% { opacity: 0; transform: translate(-50%, -30%) scale(0.55); }
      22% { opacity: 1; transform: translate(-50%, -65%) scale(1.08); }
      75% { opacity: 1; transform: translate(-50%, -115%) scale(1.0); }
      100% { opacity: 0; transform: translate(-50%, -155%) scale(0.92); }
    }

    /* Bottom Bar */
    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .controls-hint {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 9px 15px;
      border-radius: 12px;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.45;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.38);
      transition: opacity 0.4s ease;
    }

    .controls-hint strong {
      color: #fff;
      font-weight: 700;
    }

    .key-pill {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 10.5px;
      font-weight: 700;
      margin: 0 2px;
    }

    .quick-actions {
      display: flex;
      gap: 7px;
      flex-wrap: wrap;
      margin-left: auto;
    }

    .icon-btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      color: var(--text-main);
      font-size: 11.5px;
      font-weight: 700;
      padding: 8px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.16s ease;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
    }

    .icon-btn:hover {
      background: rgba(30, 42, 68, 0.9);
      border-color: rgba(255, 255, 255, 0.28);
      transform: translateY(-1px);
    }

    .icon-btn.toggled {
      border-color: var(--accent-cyan);
      color: var(--accent-cyan);
    }

    /* Round Summary Modal */
    #summary-modal {
      position: fixed;
      inset: 0;
      background: rgba(4, 8, 18, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 40;
      padding: 20px;
    }

    #summary-modal.open {
      display: flex;
    }

    .summary-card {
      background: linear-gradient(165deg, rgba(17, 25, 44, 0.96), rgba(9, 13, 25, 0.98));
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 22px;
      padding: 28px 32px;
      max-width: 430px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.75);
      animation: modalPop 0.28s cubic-bezier(0.18, 0.89, 0.32, 1.2);
    }

    @keyframes modalPop {
      from { opacity: 0; transform: scale(0.88) translateY(14px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .rank-badge {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(255, 190, 46, 0.16);
      color: var(--accent-gold);
      border: 1px solid rgba(255, 190, 46, 0.45);
      margin-bottom: 10px;
    }

    .summary-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 0.02em;
      margin-bottom: 4px;
    }

    .summary-sub {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 22px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 11px;
    }

    .stat-box .lbl {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
    }

    .stat-box .val {
      font-size: 22px;
      font-weight: 800;
      margin-top: 2px;
      color: #fff;
    }

    .play-again-btn {
      width: 100%;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #ff6a26, #e53900);
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(255, 98, 31, 0.45);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .play-again-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(255, 98, 31, 0.65);
    }

    @media (max-width: 680px) {
      #hud { padding: 10px; }
      .sb-cell { padding: 6px 10px; min-width: 60px; }
      .sb-val { font-size: 17px; }
      .controls-hint { display: none; }
      .mode-btn { font-size: 10px; padding: 5px 9px; }
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud">
    <div class="top-bar">
      <div class="mode-switcher ui-interactive" id="mode-switcher">
        <button class="mode-btn active" data-mode="freethrow">10-Shot Free Throw</button>
        <button class="mode-btn" data-mode="blitz">60s Blitz</button>
        <button class="mode-btn" data-mode="around">5-Spot Arc</button>
        <button class="mode-btn" data-mode="zen">Zen Practice</button>
      </div>

      <div class="scorebug">
        <div class="sb-cell highlight">
          <span class="sb-label">Score</span>
          <span class="sb-val" id="hud-score">0</span>
        </div>
        <div class="sb-cell">
          <span class="sb-label" id="hud-progress-label">Shots</span>
          <span class="sb-val" id="hud-progress">1 / 10</span>
        </div>
        <div class="sb-cell">
          <span class="sb-label">FG%</span>
          <span class="sb-val" id="hud-fg">0%</span>
        </div>
        <div class="sb-cell">
          <span class="sb-label">Streak</span>
          <span class="sb-val" id="hud-streak">0</span>
        </div>
        <div class="sb-cell">
          <span class="sb-label">Best</span>
          <span class="sb-val gold" id="hud-best">0</span>
        </div>
      </div>

      <div class="status-strip">
        <div class="shot-pips" id="shot-pips"></div>
        <div class="wind-badge" id="wind-badge">
          <span>WIND</span>
          <span class="wind-arrow" id="wind-arrow">➤</span>
          <span id="wind-text">0.0 m/s</span>
        </div>
      </div>
    </div>

    <div class="bottom-bar">
      <div class="controls-hint" id="controls-hint">
        <strong>Move Mouse</strong> to Aim (Hoop or Glass for Bank Shot) •
        <strong>Hold Click / <span class="key-pill">Space</span></strong> for Green Zone — or <strong>Flick Up</strong> to Shoot!
      </div>

      <div class="quick-actions ui-interactive">
        <button class="icon-btn" id="btn-cam" title="Switch Camera Angle (C)">🎥 <span id="lbl-cam">Shooter Cam</span></button>
        <button class="icon-btn toggled" id="btn-arc" title="Toggle Aim Guide (G)">🎯 <span id="lbl-arc">Guide: Pro</span></button>
        <button class="icon-btn" id="btn-wind" title="Toggle Crosswind Challenge (V)">💨 <span id="lbl-wind">Wind: Off</span></button>
        <button class="icon-btn toggled" id="btn-sound" title="Toggle Audio (M)">🔊 <span id="lbl-sound">SFX</span></button>
        <button class="icon-btn" id="btn-reset" title="Restart Round (R)">↺ Reset</button>
      </div>
    </div>
  </div>

  <!-- Dynamic Shot Meter -->
  <div id="shot-meter-wrap">
    <div class="meter-track">
      <div class="meter-good-zone"></div>
      <div class="meter-green-zone"></div>
      <div class="meter-fill" id="meter-fill"></div>
      <div class="meter-tick" id="meter-tick"></div>
    </div>
    <div class="release-tag" id="release-tag">PERFECT!</div>
  </div>

  <div id="aim-hud-info">ARC 54°</div>
  <div id="callout-layer"></div>

  <!-- End of Round Modal -->
  <div id="summary-modal" class="ui-interactive">
    <div class="summary-card">
      <div class="rank-badge" id="sum-rank">ALL-STAR</div>
      <div class="summary-title" id="sum-title">ROUND COMPLETE</div>
      <div class="summary-sub" id="sum-sub">10-Shot Free Throw Challenge</div>
      <div class="stats-grid">
        <div class="stat-box">
          <div class="lbl">Final Score</div>
          <div class="val" id="sum-score">0</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Field Goal %</div>
          <div class="val" id="sum-fg">0%</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Pure Swishes</div>
          <div class="val" id="sum-swishes">0</div>
        </div>
        <div class="stat-box">
          <div class="lbl">Best Streak</div>
          <div class="val" id="sum-streak">0</div>
        </div>
      </div>
      <button class="play-again-btn" id="btn-play-again">Shoot Again (Space)</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';

    // =========================================================================
    // CONSTANTS & REGULATION DIMENSIONS (Metric, Hoop Center at (0, 3.05, 0))
    // =========================================================================
    const GRAVITY = -9.81;
    const AIR_DRAG = 0.011;
    const BALL_RADIUS = 0.12;
    const RIM_Y = 3.05;
    const RIM_RADIUS = 0.24;      // Generous pro hoop inner radius for rewarding swishes
    const RIM_TUBE = 0.012;
    const BOARD_Z = -0.39;        // Front face of glass backboard
    const BOARD_HALF_W = 0.915;   // 1.83m wide
    const BOARD_MIN_Y = 2.90;
    const BOARD_MAX_Y = 3.97;     // 1.07m tall
    const BOARD_THICK = 0.06;
    const FREE_THROW_Z = 4.18;    // 4.57m from backboard face (-0.39 + 4.57 = 4.18)
    const SWEET_SPOT = 0.76;      // Green window target on Shot Meter

    const FIVE_SPOTS = [
      { name: 'Left Corner',  x: -5.15, z: 1.25 },
      { name: 'Left Wing',    x: -4.05, z: 4.10 },
      { name: 'Top of Key',   x:  0.00, z: 5.55 },
      { name: 'Right Wing',   x:  4.05, z: 4.10 },
      { name: 'Right Corner', x:  5.15, z: 1.25 }
    ];

    // =========================================================================
    // PROCEDURAL WEB AUDIO SYNTHESIZER (Zero External Assets)
    // =========================================================================
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }

      unlock() {
        if (!this.enabled) return;
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }

      playRelease(isPerfect) {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(isPerfect ? 520 : 340, t);
        osc.frequency.exponentialRampToValueAtTime(isPerfect ? 880 : 480, t + 0.09);
        gain.gain.setValueAtTime(0.08, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
        osc.connect(gain).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.11);
      }

      playSwish(onFire = false) {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        const dur = 0.28;
        const bufSize = Math.floor(this.ctx.sampleRate * dur);
        const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
        const data = buf.getChannelData(0);
        for (let i = 0; i < bufSize; i++) {
          const env = Math.sin(Math.PI * Math.pow(i / bufSize, 0.72));
          data[i] = (Math.random() * 2 - 1) * env;
        }
        const noise = this.ctx.createBufferSource();
        noise.buffer = buf;

        const filter = this.ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.Q.value = 2.4;
        filter.frequency.setValueAtTime(900, t);
        filter.frequency.exponentialRampToValueAtTime(2600, t + 0.09);
        filter.frequency.exponentialRampToValueAtTime(750, t + dur);

        const gain = this.ctx.createGain();
        gain.gain.setValueAtTime(0.34, t);
        gain.gain.exponentialRampToValueAtTime(0.01, t + dur);

        noise.connect(filter).connect(gain).connect(this.ctx.destination);
        noise.start(t);

        // Reward chime
        const notes = onFire ? [587.33, 880, 1174.66] : [523.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t + idx * 0.055);
          g.gain.setValueAtTime(0.09, t + idx * 0.055);
          g.gain.exponentialRampToValueAtTime(0.001, t + idx * 0.055 + 0.32);
          osc.connect(g).connect(this.ctx.destination);
          osc.start(t + idx * 0.055);
          osc.stop(t + idx * 0.055 + 0.34);
        });
      }

      playRim(intensity = 1.0) {
        if (!this.enabled || !this.ctx) return;
        const vol = Math.min(1, Math.max(0.08, intensity * 0.16));
        const t = this.ctx.currentTime;
        [192, 438, 912].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = i === 0 ? 'triangle' : 'sine';
          osc.frequency.setValueAtTime(freq, t);
          osc.frequency.exponentialRampToValueAtTime(freq * 0.94, t + 0.16);
          g.gain.setValueAtTime(vol / (i + 1), t);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.18 - i * 0.03);
          osc.connect(g).connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.19);
        });
      }

      playBackboard(intensity = 1.0) {
        if (!this.enabled || !this.ctx) return;
        const vol = Math.min(0.4, Math.max(0.06, intensity * 0.09));
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(125, t);
        osc.frequency.exponentialRampToValueAtTime(52, t + 0.14);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.15);
        osc.connect(g).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      }

      playBounce(intensity = 1.0) {
        if (!this.enabled || !this.ctx) return;
        const vol = Math.min(0.34, Math.max(0.03, intensity * 0.075));
        const t = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const g = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(148, t);
        osc.frequency.exponentialRampToValueAtTime(74, t + 0.11);
        g.gain.setValueAtTime(vol, t);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
        osc.connect(g).connect(this.ctx.destination);
        osc.start(t);
        osc.stop(t + 0.13);
      }

      playBuzzer() {
        if (!this.enabled || !this.ctx) return;
        const t = this.ctx.currentTime;
        [110, 146.8, 220].forEach((freq) => {
          const osc = this.ctx.createOscillator();
          const g = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(freq, t);
          g.gain.setValueAtTime(0.085, t);
          g.gain.setValueAtTime(0.085, t + 0.55);
          g.gain.exponentialRampToValueAtTime(0.001, t + 0.78);
          osc.connect(g).connect(this.ctx.destination);
          osc.start(t);
          osc.stop(t + 0.8);
        });
      }
    }

    // =========================================================================
    // PROCEDURAL TEXTURES (Hardwood Court, 8-Panel Basketball, Glass, LED Board)
    // =========================================================================
    function createBasketballTextures(isMoneyBall = false) {
      const W = 512, H = 256;
      const diffCanvas = document.createElement('canvas');
      diffCanvas.width = W;
      diffCanvas.height = H;
      const dCtx = diffCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = W;
      bumpCanvas.height = H;
      const bCtx = bumpCanvas.getContext('2d');

      const dImg = dCtx.createImageData(W, H);
      const bImg = bCtx.createImageData(W, H);

      // Exact 3D spherical basketball saddle curve: X^2 + Y^2 + Z^2 = 1
      const curvePts = [];
      const a = 0.70, b = 0.30;
      const twoSqrtAB = 2 * Math.sqrt(a * b);
      const SAMPLES = 160;
      for (let i = 0; i < SAMPLES; i++) {
        const t = (i / SAMPLES) * Math.PI * 2;
        curvePts.push(
          a * Math.cos(t) + b * Math.cos(3 * t),
          a * Math.sin(t) - b * Math.sin(3 * t),
          twoSqrtAB * Math.sin(2 * t)
        );
      }

      for (let py = 0; py < H; py++) {
        const v = (py + 0.5) / H;
        const phi = v * Math.PI;
        const sinPhi = Math.sin(phi);
        const ny = Math.cos(phi);

        for (let px = 0; px < W; px++) {
          const u = (px + 0.5) / W;
          const theta = u * Math.PI * 2;
          const nx = sinPhi * Math.cos(theta);
          const nz = sinPhi * Math.sin(theta);

          // Great circle seams (X=0, Y=0) + 3D saddle curve seam
          let minDist = Math.min(Math.abs(nx), Math.abs(ny));
          for (let k = 0; k < curvePts.length; k += 3) {
            const dx = nx - curvePts[k];
            const dy = ny - curvePts[k + 1];
            const dz = nz - curvePts[k + 2];
            const d2 = dx * dx + dy * dy + dz * dz;
            if (d2 < minDist * minDist) minDist = Math.sqrt(d2);
          }

          const idx = (py * W + px) * 4;

          // High-frequency leather pebble cellular noise
          const pScale = 68;
          const cellHash = Math.sin(nx * pScale * 12.9898 + ny * pScale * 78.233 + nz * pScale * 37.719) * 43758.5453;
          const frac = cellHash - Math.floor(cellHash);
          const pebble = 0.5 + 0.5 * Math.sin(nx * 145) * Math.sin(ny * 145) * Math.sin(nz * 145) * 0.7 + (frac - 0.5) * 0.35;

          const seamWidth = 0.024;
          const seamFactor = Math.max(0, Math.min(1, (minDist - seamWidth * 0.55) / (seamWidth * 0.55)));

          let r, g, bl;
          if (!isMoneyBall) {
            // Classic pro leather orange
            const baseR = 216 + (pebble - 0.5) * 30;
            const baseG = 86 + (pebble - 0.5) * 18;
            const baseB = 24 + (pebble - 0.5) * 10;
            r = 22 + (baseR - 22) * seamFactor;
            g = 20 + (baseG - 20) * seamFactor;
            bl = 20 + (baseB - 20) * seamFactor;
          } else {
            // Red / White / Blue Money Ball panels
            const quadrant = (nx >= 0 ? 1 : 0) + (ny >= 0 ? 2 : 0) + (nz >= 0 ? 4 : 0);
            let pr = 238, pg = 242, pb = 248;
            if (quadrant % 3 === 0) { pr = 228; pg = 38; pb = 54; }
            else if (quadrant % 3 === 1) { pr = 28; pg = 96; pb = 218; }
            const shade = (pebble - 0.5) * 22;
            r = 25 + (pr + shade - 25) * seamFactor;
            g = 25 + (pg + shade - 25) * seamFactor;
            bl = 28 + (pb + shade - 28) * seamFactor;
          }

          dImg.data[idx] = Math.max(0, Math.min(255, r));
          dImg.data[idx + 1] = Math.max(0, Math.min(255, g));
          dImg.data[idx + 2] = Math.max(0, Math.min(255, bl));
          dImg.data[idx + 3] = 255;

          const bumpVal = seamFactor * (135 + pebble * 110);
          bImg.data[idx] = bumpVal;
          bImg.data[idx + 1] = bumpVal;
          bImg.data[idx + 2] = bumpVal;
          bImg.data[idx + 3] = 255;
        }
      }

      dCtx.putImageData(dImg, 0, 0);
      bCtx.putImageData(bImg, 0, 0);

      const map = new THREE.CanvasTexture(diffCanvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.wrapS = THREE.RepeatWrapping;
      map.anisotropy = 8;

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = THREE.RepeatWrapping;

      return { map, bumpMap };
    }

    function createCourtTextures() {
      // Court plane covers width 18m (x: -9..9), length 20m (z: -3..17)
      // Hoop is at world (0, 0, 0). Baseline is at z = -1.61m!
      const W = 2048, H = 2048;
      const courtW = 18.0, courtL = 20.0;
      const zMin = -3.0; // maps to v=0 (top of canvas py=0)

      const toPx = (wx) => ((wx + courtW * 0.5) / courtW) * W;
      const toPy = (wz) => ((wz - zMin) / courtL) * H;
      const mToPxX = (m) => (m / courtW) * W;
      const mToPxZ = (m) => (m / courtL) * H;

      const canvas = document.createElement('canvas');
      canvas.width = W;
      canvas.height = H;
      const ctx = canvas.getContext('2d');

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = W;
      roughCanvas.height = H;
      const rCtx = roughCanvas.getContext('2d');

      // Base maple fill
      ctx.fillStyle = '#c88b4b';
      ctx.fillRect(0, 0, W, H);
      rCtx.fillStyle = '#343434';
      rCtx.fillRect(0, 0, W, H);

      // Draw hardwood planks running along Z
      const plankW = mToPxX(0.11);
      const numPlanks = Math.ceil(W / plankW);
      let seed = 1337;
      const rand = () => {
        seed = (seed * 16807) % 2147483647;
        return (seed - 1) / 2147483646;
      };

      for (let i = 0; i < numPlanks; i++) {
        const x = i * plankW;
        let y = -rand() * 260;
        while (y < H) {
          const len = 240 + rand() * 340;
          const tone = rand();
          const lShift = (tone - 0.5) * 24;
          const r = Math.round(204 + lShift);
          const g = Math.round(142 + lShift * 0.78);
          const b = Math.round(78 + lShift * 0.52);

          ctx.fillStyle = `rgb(${r},${g},${b})`;
          ctx.fillRect(x, y, plankW - 0.7, len - 0.7);

          // Subtle wood grain streaks
          ctx.fillStyle = `rgba(110, 62, 22, ${0.05 + rand() * 0.06})`;
          for (let s = 0; s < 3; s++) {
            const gx = x + rand() * (plankW - 2);
            ctx.fillRect(gx, y, 1.1, len);
          }

          // Plank seam
          ctx.fillStyle = 'rgba(72, 38, 12, 0.32)';
          ctx.fillRect(x, y + len - 1, plankW, 1);

          // Gloss variation on roughness map
          const rVal = Math.round(38 + rand() * 26);
          rCtx.fillStyle = `rgb(${rVal},${rVal},${rVal})`;
          rCtx.fillRect(x, y, plankW, len);

          y += len;
        }
      }

      // Outer dark navy apron border outside court lines (Sidelines x = +-7.5, Baseline z = -1.61)
      const basePy = toPy(-1.61);
      const leftPx = toPx(-7.5);
      const rightPx = toPx(7.5);

      ctx.fillStyle = '#0c182e';
      ctx.fillRect(0, 0, W, basePy);
      ctx.fillRect(0, 0, leftPx, H);
      ctx.fillRect(rightPx, 0, W - rightPx, H);

      // Baseline pro typography
      ctx.save();
      ctx.fillStyle = 'rgba(255, 255, 255, 0.16)';
      ctx.font = '900 54px Inter, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PRO HOOPS ARENA', W * 0.5, basePy * 0.52);
      ctx.restore();

      // Painted Key / Lane (width 4.9m: x in [-2.45, +2.45], z from -1.61 to +4.18)
      const keyLeft = toPx(-2.45);
      const keyW = mToPxX(4.9);
      const ftPy = toPy(FREE_THROW_Z);

      ctx.fillStyle = 'rgba(13, 32, 68, 0.88)';
      ctx.fillRect(keyLeft, basePy, keyW, ftPy - basePy);

      // Inner accent trim inside paint
      ctx.strokeStyle = '#ff621f';
      ctx.lineWidth = mToPxX(0.06);
      ctx.strokeRect(keyLeft + 8, basePy + 8, keyW - 16, ftPy - basePy - 16);

      // Crisp white regulation court lines (5cm = 0.05m wide)
      const lineW = Math.max(4, mToPxX(0.055));
      ctx.strokeStyle = '#f8fafc';
      ctx.fillStyle = '#f8fafc';
      ctx.lineWidth = lineW;
      ctx.lineCap = 'butt';

      // Court perimeter (baseline + sidelines)
      ctx.beginPath();
      ctx.moveTo(leftPx, H);
      ctx.lineTo(leftPx, basePy);
      ctx.lineTo(rightPx, basePy);
      ctx.lineTo(rightPx, H);
      ctx.stroke();

      // Key rectangle
      ctx.strokeRect(keyLeft, basePy, keyW, ftPy - basePy);

      // Lane hash marks along key sides
      const hashZ = [-0.05, 0.85, 1.75, 2.65];
      hashZ.forEach((hz, idx) => {
        const py = toPy(hz);
        const hLen = idx === 0 ? mToPxX(0.32) : mToPxX(0.22);
        ctx.lineWidth = idx === 0 ? lineW * 1.8 : lineW;
        ctx.beginPath();
        ctx.moveTo(keyLeft - hLen, py);
        ctx.lineTo(keyLeft, py);
        ctx.moveTo(keyLeft + keyW, py);
        ctx.lineTo(keyLeft + keyW + hLen, py);
        ctx.stroke();
      });
      ctx.lineWidth = lineW;

      // Free-throw circle (radius 1.80m centered at (0, FREE_THROW_Z))
      const rxCircle = mToPxX(1.80);
      const rzCircle = mToPxZ(1.80);
      // Top half (away from hoop, z > FREE_THROW_Z): solid
      ctx.beginPath();
      ctx.ellipse(toPx(0), ftPy, rxCircle, rzCircle, 0, 0, Math.PI, false);
      ctx.stroke();

      // Bottom half (inside paint, z < FREE_THROW_Z): dashed
      ctx.save();
      ctx.setLineDash([18, 18]);
      ctx.beginPath();
      ctx.ellipse(toPx(0), ftPy, rxCircle, rzCircle, 0, Math.PI, Math.PI * 2, false);
      ctx.stroke();
      ctx.restore();

      // Restricted area arc under hoop (radius 1.25m around (0, 0))
      ctx.beginPath();
      ctx.ellipse(toPx(0), toPy(0), mToPxX(1.25), mToPxZ(1.25), 0, 0, Math.PI, false);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(toPx(-1.25), basePy);
      ctx.lineTo(toPx(-1.25), toPy(0));
      ctx.moveTo(toPx(1.25), basePy);
      ctx.lineTo(toPx(1.25), toPy(0));
      ctx.stroke();

      // 3-Point Line (Corner straight lines at x = +-6.60m up to z = 1.38m, then 6.75m arc!)
      const cornerX = 6.60;
      const arcR = 6.75;
      const joinZ = Math.sqrt(arcR * arcR - cornerX * cornerX); // ~1.415m
      const startAngle = Math.atan2(joinZ, cornerX);

      ctx.beginPath();
      ctx.moveTo(toPx(-cornerX), basePy);
      ctx.lineTo(toPx(-cornerX), toPy(joinZ));
      ctx.ellipse(toPx(0), toPy(0), mToPxX(arcR), mToPxZ(arcR), 0, Math.PI - startAngle, startAngle, true);
      ctx.lineTo(toPx(cornerX), basePy);
      ctx.stroke();

      // Center court circle hint near back of court (z = 12.4m)
      const midPy = toPy(12.4);
      ctx.beginPath();
      ctx.moveTo(leftPx, midPy);
      ctx.lineTo(rightPx, midPy);
      ctx.stroke();

      ctx.fillStyle = 'rgba(255, 98, 31, 0.85)';
      ctx.beginPath();
      ctx.ellipse(toPx(0), midPy, mToPxX(1.85), mToPxZ(1.85), 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      const map = new THREE.CanvasTexture(canvas);
      map.colorSpace = THREE.SRGBColorSpace;
      map.anisotropy = 16;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.anisotropy = 8;

      return { map, roughnessMap };
    }

    // =========================================================================
    // DYNAMIC 3D CLOTH NET (Verlet Spring-Mass + Thick 3D Braided Cords)
    // =========================================================================
    const NET_COLS = 12;
    const NET_ROWS = 7; // row 0 pinned to rim, rows 1..6 free diamond knots
    const netRestRadii = [0.234, 0.202, 0.170, 0.148, 0.138, 0.142, 0.152];
    const netRestY =     [3.035, 2.965, 2.890, 2.815, 2.740, 2.668, 2.600];

    const netNodes = [];
    for (let r = 0; r < NET_ROWS; r++) {
      for (let c = 0; c < NET_COLS; c++) {
        const angle = ((c + (r % 2) * 0.5) / NET_COLS) * Math.PI * 2;
        const x = Math.cos(angle) * netRestRadii[r];
        const y = netRestY[r];
        const z = Math.sin(angle) * netRestRadii[r];
        netNodes.push({
          x, y, z,
          px: x, py: y, pz: z,
          rx: x, ry: y, rz: z,
          pinned: r === 0
        });
      }
    }
    const netIdx = (r, c) => r * NET_COLS + ((c + NET_COLS) % NET_COLS);

    const netSprings = [];
    const netVisualSegments = []; // Pairs of node indices rendered as 3D braided cords
    const addSpring = (i, j, stiffness, visual = false, radius = 0.0038) => {
      const a = netNodes[i], b = netNodes[j];
      const rest = Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);
      netSprings.push({ i, j, rest, stiffness });
      if (visual) netVisualSegments.push({ i, j, radius });
    };

    for (let r = 0; r < NET_ROWS - 1; r++) {
      const cordR = 0.0042 - r * 0.00012;
      for (let c = 0; c < NET_COLS; c++) {
        const curr = netIdx(r, c);
        if (r % 2 === 0) {
          addSpring(curr, netIdx(r + 1, c), 0.88, true, cordR);
          addSpring(curr, netIdx(r + 1, c - 1), 0.88, true, cordR);
        } else {
          addSpring(curr, netIdx(r + 1, c), 0.88, true, cordR);
          addSpring(curr, netIdx(r + 1, c + 1), 0.88, true, cordR);
        }
      }
    }
    // Horizontal hoop structural springs (keep circular tunnel shape; top & bottom subtle loops)
    for (let r = 1; r < NET_ROWS; r++) {
      for (let c = 0; c < NET_COLS; c++) {
        addSpring(netIdx(r, c), netIdx(r, c + 1), 0.42, false);
      }
    }

    // Build single dynamic 3D BufferGeometry for thick braided white cords
    const segCount = netVisualSegments.length;
    const netPositions = new Float32Array(segCount * 8 * 3);
    const netNormals = new Float32Array(segCount * 8 * 3);
    const netIndices = [];
    for (let s = 0; s < segCount; s++) {
      const base = s * 8;
      for (let side = 0; side < 4; side++) {
        const next = (side + 1) % 4;
        const a0 = base + side, a1 = base + next;
        const b0 = base + 4 + side, b1 = base + 4 + next;
        netIndices.push(a0, b0, b1, a0, b1, a1);
      }
    }

    const netGeo = new THREE.BufferGeometry();
    netGeo.setAttribute('position', new THREE.BufferAttribute(netPositions, 3));
    netGeo.setAttribute('normal', new THREE.BufferAttribute(netNormals, 3));
    netGeo.setIndex(netIndices);

    const netMat = new THREE.MeshStandardMaterial({
      color: 0xf4f7fb,
      roughness: 0.65,
      metalness: 0.02,
      side: THREE.DoubleSide
    });
    const netMesh = new THREE.Mesh(netGeo, netMat);
    netMesh.castShadow = true;
    netMesh.frustumCulled = false;
    scene.add(netMesh);

    let rimFlexAngle = 0;
    let rimFlexVel = 0;

    function updateNetGeometry() {
      for (let s = 0; s < segCount; s++) {
        const seg = netVisualSegments[s];
        const A = netNodes[seg.i];
        const B = netNodes[seg.j];
        const r = seg.radius;

        let ux = B.x - A.x, uy = B.y - A.y, uz = B.z - A.z;
        const len = Math.hypot(ux, uy, uz) || 1e-4;
        ux /= len; uy /= len; uz /= len;

        // Orthonormal basis perpendicular to cord direction
        let rx = A.x, ry = 0, rz = A.z;
        const rLen = Math.hypot(rx, rz);
        if (rLen > 1e-4) { rx /= rLen; rz /= rLen; } else { rx = 1; rz = 0; }

        let e1x = uy * rz - uz * ry;
        let e1y = uz * rx - ux * rz;
        let e1z = ux * ry - uy * rx;
        const e1Len = Math.hypot(e1x, e1y, e1z) || 1;
        e1x /= e1Len; e1y /= e1Len; e1z /= e1Len;

        const e2x = uy * e1z - uz * e1y;
        const e2y = uz * e1x - ux * e1z;
        const e2z = ux * e1y - uy * e1x;

        const dirs = [
          [e1x, e1y, e1z],
          [e2x, e2y, e2z],
          [-e1x, -e1y, -e1z],
          [-e2x, -e2y, -e2z]
        ];

        const baseOffset = s * 24;
        for (let k = 0; k < 4; k++) {
          const [dx, dy, dz] = dirs[k];
          const iA = baseOffset + k * 3;
          const iB = baseOffset + (4 + k) * 3;

          netPositions[iA]     = A.x + dx * r;
          netPositions[iA + 1] = A.y + dy * r;
          netPositions[iA + 2] = A.z + dz * r;
          netNormals[iA] = dx; netNormals[iA + 1] = dy; netNormals[iA + 2] = dz;

          netPositions[iB]     = B.x + dx * r;
          netPositions[iB + 1] = B.y + dy * r;
          netPositions[iB + 2] = B.z + dz * r;
          netNormals[iB] = dx; netNormals[iB + 1] = dy; netNormals[iB + 2] = dz;
        }
      }
      netGeo.attributes.position.needsUpdate = true;
      netGeo.attributes.normal.needsUpdate = true;
    }

    function stepNetPhysics(dt, activeBalls, windVec) {
      const subDt = Math.min(dt, 0.02);
      const cosF = Math.cos(rimFlexAngle), sinF = Math.sin(rimFlexAngle);

      // Update pinned top nodes with rim flex
      for (let c = 0; c < NET_COLS; c++) {
        const n = netNodes[c];
        const relZ = n.rz - BOARD_Z;
        const relY = n.ry - RIM_Y;
        n.x = n.rx;
        n.y = RIM_Y + relY * cosF - relZ * sinF;
        n.z = BOARD_Z + relY * sinF + relZ * cosF;
        n.px = n.x; n.py = n.y; n.pz = n.z;
      }

      // Verlet integration
      const damping = 0.968;
      for (let i = NET_COLS; i < netNodes.length; i++) {
        const n = netNodes[i];
        const vx = (n.x - n.px) * damping;
        const vy = (n.y - n.py) * damping;
        const vz = (n.z - n.pz) * damping;
        n.px = n.x; n.py = n.y; n.pz = n.z;
        n.x += vx + windVec.x * 0.14 * subDt * subDt;
        n.y += vy + GRAVITY * 1.15 * subDt * subDt;
        n.z += vz + windVec.z * 0.14 * subDt * subDt;

        // Gentle inward catenary tendency so net keeps classic hourglass drape
        const row = Math.floor(i / NET_COLS);
        const targetR = netRestRadii[row];
        const curR = Math.hypot(n.x, n.z);
        if (curR > 1e-4) {
          const pull = (targetR - curR) * 0.045;
          n.x += (n.x / curR) * pull;
          n.z += (n.z / curR) * pull;
        }
      }

      // Ball-to-Net tactile interaction (whips net & gently funnels ball!)
      activeBalls.forEach((b) => {
        if (b.pos.y < 2.38 || b.pos.y > 3.16) return;
        const horizR = Math.hypot(b.pos.x, b.pos.z);
        if (horizR > 0.42) return;

        const touchRadius = BALL_RADIUS + 0.022;
        for (let i = NET_COLS; i < netNodes.length; i++) {
          const n = netNodes[i];
          const dx = n.x - b.pos.x;
          const dy = n.y - b.pos.y;
          const dz = n.z - b.pos.z;
          const dist = Math.hypot(dx, dy, dz);
          if (dist < touchRadius && dist > 1e-5) {
            const pen = touchRadius - dist;
            const nx = dx / dist, ny = dy / dist, nz = dz / dist;
            n.x += nx * pen * 0.88 + b.vel.x * subDt * 0.35;
            n.y += ny * pen * 0.65 + b.vel.y * subDt * 0.22;
            n.z += nz * pen * 0.88 + b.vel.z * subDt * 0.35;

            // Subtle realistic nylon drag on the ball inside the net
            b.vel.x *= 0.9965;
            b.vel.z *= 0.9965;
            if (b.vel.y < -2.2) b.vel.y *= 0.994;
          }
        }
      });

      // Constraint relaxation iterations
      for (let iter = 0; iter < 5; iter++) {
        for (let s = 0; s < netSprings.length; s++) {
          const sp = netSprings[s];
          const A = netNodes[sp.i];
          const B = netNodes[sp.j];
          const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
          const dist = Math.hypot(dx, dy, dz) || 1e-5;
          const diff = ((dist - sp.rest) / dist) * sp.stiffness;
          if (A.pinned && !B.pinned) {
            B.x -= dx * diff;
            B.y -= dy * diff;
            B.z -= dz * diff;
          } else if (!A.pinned && !B.pinned) {
            const half = diff * 0.5;
            A.x += dx * half; A.y += dy * half; A.z += dz * half;
            B.x -= dx * half; B.y -= dy * half; B.z -= dz * half;
          }
        }
      }

      updateNetGeometry();
    }

    function whipNetSwish(power = 1.0) {
      // Classic upward/outward swish whip on lower rings
      for (let r = 3; r < NET_ROWS; r++) {
        const strength = (r - 2) * 0.018 * power;
        for (let c = 0; c < NET_COLS; c++) {
          const n = netNodes[netIdx(r, c)];
          const rad = Math.hypot(n.x, n.z) || 1;
          n.x += (n.x / rad) * strength * 0.85;
          n.z += (n.z / rad) * strength * 0.85;
          n.y += strength * 1.45;
        }
      }
    }

    const fireAuraMesh = new THREE.Mesh(

    // =========================================================================
    // SUB-STEPPED 3D RIGID-BODY BASKETBALL PHYSICS + SPIN COUPLING
    // =========================================================================
    function resolveSphereContact(b, nx, ny, nz, penetration, restitution, friction) {
      b.pos.x += nx * penetration;
      b.pos.y += ny * penetration;
      b.pos.z += nz * penetration;

      const rcx = -BALL_RADIUS * nx;
      const rcy = -BALL_RADIUS * ny;
      const rcz = -BALL_RADIUS * nz;

      // Contact surface velocity v_c = v + omega x r_c
      const vcx = b.vel.x + (b.omega.y * rcz - b.omega.z * rcy);
      const vcy = b.vel.y + (b.omega.z * rcx - b.omega.x * rcz);
      const vcz = b.vel.z + (b.omega.x * rcy - b.omega.y * rcx);

      const vn = b.vel.x * nx + b.vel.y * ny + b.vel.z * nz;
      if (vn >= 0) return 0;

      const impactSpeed = -vn;
      const effRest = impactSpeed < 0.38 ? 0 : restitution;
      const jn = -(1 + effRest) * vn;

      // Tangential slip & spin-to-bounce friction (hollow sphere I = 2/3 m R^2 -> m_eff_inv = 2.5)
      const vtx = vcx - vn * nx;
      const vty = vcy - vn * ny;
      const vtz = vcz - vn * nz;
      const vtLen = Math.hypot(vtx, vty, vtz);

      let jx = jn * nx, jy = jn * ny, jz = jn * nz;
      if (vtLen > 1e-5) {
        const jt = Math.min(0.4 * vtLen, friction * jn);
        jx -= jt * (vtx / vtLen);
        jy -= jt * (vty / vtLen);
        jz -= jt * (vtz / vtLen);
      }

      b.vel.x += jx;
      b.vel.y += jy;
      b.vel.z += jz;

      const invInertia = 1.5 / (BALL_RADIUS * BALL_RADIUS);
      b.omega.x += (rcy * jz - rcz * jy) * invInertia;
      b.omega.y += (rcz * jx - rcx * jz) * invInertia;
      b.omega.z += (rcx * jy - rcy * jx) * invInertia;

      return impactSpeed;
    }

    function collideBox(b, minX, maxX, minY, maxY, minZ, maxZ, restitution, friction) {
      const cx = Math.max(minX, Math.min(maxX, b.pos.x));
      const cy = Math.max(minY, Math.min(maxY, b.pos.y));
      const cz = Math.max(minZ, Math.min(maxZ, b.pos.z));
      const dx = b.pos.x - cx, dy = b.pos.y - cy, dz = b.pos.z - cz;
      const dist = Math.hypot(dx, dy, dz);
      if (dist < BALL_RADIUS) {
        if (dist > 1e-6) {
          return resolveSphereContact(b, dx / dist, dy / dist, dz / dist, BALL_RADIUS - dist, restitution, friction);
        } else {
          return resolveSphereContact(b, 0, 0, 1, BALL_RADIUS, restitution, friction);
        }
      }
      return 0;
    }

    function stepBallSubstep(b, subDt, windVec, isPrimary) {
      const prevY = b.pos.y;

      // Air drag + wind
      const rvx = b.vel.x - windVec.x;
      const rvy = b.vel.y;
      const rvz = b.vel.z - windVec.z;
      const speed = Math.hypot(rvx, rvy, rvz);

      b.vel.x -= AIR_DRAG * speed * rvx * subDt;
      b.vel.y += (GRAVITY - AIR_DRAG * speed * rvy) * subDt;
      b.vel.z -= AIR_DRAG * speed * rvz * subDt;

      // Subtle Magnus lift from backspin
      const magScale = 0.0018;
      b.vel.x += (b.omega.y * b.vel.z - b.omega.z * b.vel.y) * magScale * subDt;
      b.vel.y += (b.omega.z * b.vel.x - b.omega.x * b.vel.z) * magScale * subDt;
      b.vel.z += (b.omega.x * b.vel.y - b.omega.y * b.vel.x) * magScale * subDt;

      b.pos.x += b.vel.x * subDt;
      b.pos.y += b.vel.y * subDt;
      b.pos.z += b.vel.z * subDt;

      if (isPrimary && b.pos.y > b.maxY) b.maxY = b.pos.y;

      // 1. Floor collision (y = 0)
      if (b.pos.y < BALL_RADIUS) {
        const imp = resolveSphereContact(b, 0, 1, 0, BALL_RADIUS - b.pos.y, 0.74, 0.34);
        if (imp > 0.65) {
          sfx.playBounce(imp * (isPrimary ? 1.0 : 0.45));
        }
        if (isPrimary) b.touchedFloor = true;
        // Rolling damping
        if (Math.abs(b.vel.y) < 0.2) {
          b.vel.x *= (1 - 0.55 * subDt);
          b.vel.z *= (1 - 0.55 * subDt);
          b.omega.multiplyScalar(1 - 0.55 * subDt);
        }
      }

      // 2. Tempered Glass Backboard collision
      const boardImp = collideBox(
        b,
        -BOARD_HALF_W, BOARD_HALF_W,
        BOARD_MIN_Y, BOARD_MAX_Y,
        BOARD_Z - BOARD_THICK, BOARD_Z,
        0.67, 0.36
      );
      if (boardImp > 0) {
        if (isPrimary) b.touchedBackboard = true;
        if (boardImp > 0.5 && b.soundCooldown <= 0) {
          sfx.playBackboard(boardImp);
          b.soundCooldown = 0.06;
        }
      }

      // 3. Rim Neck Bracket collision (prevents wedging through neck gap)
      collideBox(b, -0.065, 0.065, RIM_Y - 0.055, RIM_Y + 0.015, BOARD_Z, -RIM_RADIUS, 0.52, 0.3);

      // 4. Stanchion Base collision
      collideBox(b, -0.58, 0.58, 0, 1.85, -3.15, -1.60, 0.42, 0.4);

      // 5. Exact 3D Torus Rim Collision
      const dxz = Math.hypot(b.pos.x, b.pos.z);
      if (b.pos.y > RIM_Y - 0.35 && b.pos.y < RIM_Y + 0.35 && dxz < RIM_RADIUS + 0.35) {
        let qx = RIM_RADIUS, qz = 0;
        if (dxz > 1e-6) {
          qx = (b.pos.x / dxz) * RIM_RADIUS;
          qz = (b.pos.z / dxz) * RIM_RADIUS;
        }
        const rx = b.pos.x - qx;
        const ry = b.pos.y - RIM_Y;
        const rz = b.pos.z - qz;
        const tubeDist = Math.hypot(rx, ry, rz);
        const minSum = BALL_RADIUS + RIM_TUBE;
        if (tubeDist < minSum && tubeDist > 1e-6) {
          const rimImp = resolveSphereContact(
            b,
            rx / tubeDist, ry / tubeDist, rz / tubeDist,
            minSum - tubeDist,
            0.59, // Soft breakaway pro rim for authentic shooter's bounce
            0.30
          );
          if (rimImp > 0) {
            if (isPrimary) {
              b.touchedRim = true;
              b.rimHits++;
            }
            rimFlexVel += Math.min(2.6, rimImp * 0.28);
            if (rimImp > 0.45 && b.soundCooldown <= 0) {
              sfx.playRim(rimImp);
              b.soundCooldown = 0.055;
              if (rimImp > 2.2) {
                spawnParticles(new THREE.Vector3(qx, RIM_Y, qz), 10, 0xffaa44, 1.8, -6.5);
              }
            }
          }
        }
      }

      // 6. Scoring Plane Detection (Primary Shot Only)
      if (isPrimary && !b.scored && !b.invalidUnder) {
        // Disqualify if ball went UP through the cylinder from underneath
        if (prevY < RIM_Y && b.pos.y >= RIM_Y && dxz < RIM_RADIUS) {
          b.invalidUnder = true;
        }
        // Entering cylinder downward from above
        if (prevY >= RIM_Y && b.pos.y < RIM_Y && b.vel.y < 0 && dxz < RIM_RADIUS - 0.025 && b.maxY > RIM_Y + 0.14) {
          b.enteredCylinder = true;
        }
        // Confirm bucket once ball drops cleanly into the net throat
        if (b.enteredCylinder && b.pos.y < RIM_Y - 0.18 && dxz < RIM_RADIUS + 0.04) {
          b.scored = true;
          onBasketScored(b);
        }
      }

      if (b.soundCooldown > 0) b.soundCooldown -= subDt;
    }

    // =========================================================================
    // BALLISTIC CALIBRATION (Guarantees Pure Green = True Dead-Center Swish!)
    // =========================================================================
    function getShooterBackspinVector(startPos) {
      const fLen = Math.hypot(-startPos.x, -startPos.z) || 1;
      const fx = -startPos.x / fLen;
      const fz = -startPos.z / fLen;
      // Right-hand axis = forward x up = (-fz, 0, fx)
      return new THREE.Vector3(-fz * 22.5, 0, fx * 22.5);
    }

    function computeIdealLaunchVelocity(startPos, targetPos, launchDeg, windVec) {
      const dx = targetPos.x - startPos.x;
      const dz = targetPos.z - startPos.z;
      const D = Math.hypot(dx, dz);
      const dy = targetPos.y - startPos.y;
      const ux = dx / D, uz = dz / D;
      const omega = getShooterBackspinVector(startPos);

      const rad = THREE.MathUtils.degToRad(launchDeg);
      const cosA = Math.cos(rad), sinA = Math.sin(rad);
      const denom = Math.max(0.25, D * Math.tan(rad) - dy);
      let v0 = Math.sqrt((9.81 * D * D) / (2 * cosA * cosA * denom));

      // 4 forward-integration refinement passes compensating drag, Magnus backspin & wind!
      let crossOffsetX = 0, crossOffsetZ = 0;
      for (let pass = 0; pass < 4; pass++) {
        let px = startPos.x, py = startPos.y, pz = startPos.z;
        let vx = ux * v0 * cosA - crossOffsetX;
        let vy = v0 * sinA;
        let vz = uz * v0 * cosA - crossOffsetZ;

        const dt = 0.004;
        let prevDist = 0, prevX = px, prevY = py, prevZ = pz;
        for (let step = 0; step < 600; step++) {
          const rvx = vx - windVec.x, rvy = vy, rvz = vz - windVec.z;
          const sp = Math.hypot(rvx, rvy, rvz);
          vx -= AIR_DRAG * sp * rvx * dt;
          vy += (GRAVITY - AIR_DRAG * sp * rvy) * dt;
          vz -= AIR_DRAG * sp * rvz * dt;

          const magScale = 0.0018;
          vx += (omega.y * vz - omega.z * vy) * magScale * dt;
          vy += (omega.z * vx - omega.x * vz) * magScale * dt;
          vz += (omega.x * vy - omega.y * vx) * magScale * dt;

          px += vx * dt; py += vy * dt; pz += vz * dt;

          const travel = (px - startPos.x) * ux + (pz - startPos.z) * uz;
          if (travel >= D) {
            const frac = (D - prevDist) / Math.max(1e-5, travel - prevDist);
            const hitX = prevX + (px - prevX) * frac;
            const hitY = prevY + (py - prevY) * frac;
            const hitZ = prevZ + (pz - prevZ) * frac;

            const yErr = targetPos.y - hitY;
            v0 += yErr * 0.55;
            const tFlight = Math.max(0.4, step * dt);
            crossOffsetX += (hitX - targetPos.x) / tFlight * 0.90;
            crossOffsetZ += (hitZ - targetPos.z) / tFlight * 0.90;
            break;
          }
          prevDist = travel; prevX = px; prevY = py; prevZ = pz;
        }
      }

      return new THREE.Vector3(
        ux * v0 * cosA - crossOffsetX,
        v0 * sinA,
        uz * v0 * cosA - crossOffsetZ
      );
    }

    function refreshWindForShot() {
      if (!state.windEnabled) {
        state.windVec.set(0, 0, 0);
        elWindBadge.classList.remove('visible');
        return;
