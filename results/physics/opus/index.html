<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bouncing Balls in a Spinning Hexagon</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0e17;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: #cfd6e6;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #panel {
    position: fixed;
    top: 14px;
    left: 14px;
    padding: 12px 14px;
    background: rgba(20, 25, 40, 0.72);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 10px;
    backdrop-filter: blur(6px);
    font-size: 13px;
    user-select: none;
    min-width: 210px;
  }
  #panel h1 { font-size: 14px; margin: 0 0 8px; font-weight: 600; color: #fff; }
  #panel label { display: flex; justify-content: space-between; margin-top: 8px; }
  #panel input[type=range] { width: 100%; margin: 4px 0 0; accent-color: #6aa9ff; }
  #panel .row { display: flex; gap: 6px; margin-top: 10px; }
  #panel button {
    flex: 1;
    padding: 5px 8px;
    border-radius: 6px;
    border: 1px solid rgba(255, 255, 255, 0.15);
    background: rgba(255, 255, 255, 0.06);
    color: #e6ebf5;
    cursor: pointer;
    font: inherit;
  }
  #panel button:hover { background: rgba(255, 255, 255, 0.14); }
  #panel .hint { margin-top: 8px; opacity: 0.55; font-size: 11px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <h1>Spinning Hexagon</h1>
  <label>Spin speed <span id="spinVal"></span></label>
  <input id="spin" type="range" min="-4" max="4" step="0.05" value="0.8">
  <label>Gravity <span id="gravVal"></span></label>
  <input id="grav" type="range" min="0" max="4" step="0.05" value="1.6">
  <label>Bounciness <span id="bounceVal"></span></label>
  <input id="bounce" type="range" min="0.3" max="1" step="0.01" value="0.85">
  <div class="row">
    <button id="pause">Pause</button>
    <button id="reset">Reset</button>
  </div>
  <div class="hint">Space: pause · R: reset · Click: kick balls</div>
</div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  const NUM_BALLS = 10;
  const SUBSTEPS = 8;
  const FRICTION = 0.12;       // Coulomb friction coefficient against walls
  const BALL_RESTITUTION = 0.92;
  const AIR_DRAG = 0.02;       // per second, fractional

  const settings = {
    spin: 0.8,       // rad/s
    gravity: 1.6,    // in hexagon radii per s^2
    restitution: 0.85,
    paused: false,
  };

  const COLORS = [
    '#ff5d5d', '#ffa94d', '#ffd84d', '#7ee07e', '#4dd8c8',
    '#4da3ff', '#8f7bff', '#d77bff', '#ff7bc0', '#f0f0f0',
  ];

  let W = 0, H = 0, dpr = 1;
  let cx = 0, cy = 0, R = 0;    // hexagon center & circumradius
  let hexAngle = 0;
  let balls = [];

  // ---------- setup ----------

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    const oldR = R, oldCx = cx, oldCy = cy;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    cx = W / 2;
    cy = H / 2;
    R = Math.min(W, H) * 0.42;

    // Rescale existing balls so the scene survives window resizes.
    if (oldR > 0 && balls.length) {
      const s = R / oldR;
      for (const b of balls) {
        b.x = cx + (b.x - oldCx) * s;
        b.y = cy + (b.y - oldCy) * s;
        b.vx *= s; b.vy *= s; b.r *= s;
        b.m = b.r * b.r;
      }
    }
  }

  function createBalls() {
    balls = [];
    const apothem = R * Math.cos(Math.PI / 6);
    let attempts = 0;
    while (balls.length < NUM_BALLS && attempts < 5000) {
      attempts++;
      const r = R * (0.055 + Math.random() * 0.035);
      const maxD = apothem - r - 2;
      const a = Math.random() * Math.PI * 2;
      const d = Math.sqrt(Math.random()) * maxD;
      const x = cx + Math.cos(a) * d;
      const y = cy + Math.sin(a) * d;
      let ok = true;
      for (const o of balls) {
        if (Math.hypot(o.x - x, o.y - y) < o.r + r + 2) { ok = false; break; }
      }
      if (!ok) continue;
      const speed = R * (0.5 + Math.random() * 1.2);
      const va = Math.random() * Math.PI * 2;
      balls.push({
        x, y, r,
        vx: Math.cos(va) * speed,
        vy: Math.sin(va) * speed,
        m: r * r,
        rot: Math.random() * Math.PI * 2,
        spin: 0,
        color: COLORS[balls.length % COLORS.length],
      });
    }
  }

  // ---------- physics ----------

  function step(dt) {
    const omega = settings.spin;
    const g = settings.gravity * R;
    const e = settings.restitution;
    const drag = Math.max(0, 1 - AIR_DRAG * dt);

    hexAngle += omega * dt;

    // Integrate
    for (const b of balls) {
      b.vy += g * dt;
      b.vx *= drag;
      b.vy *= drag;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot += b.spin * dt;
      b.spin *= Math.max(0, 1 - 0.3 * dt);
    }

    // Ball-ball collisions
    for (let i = 0; i < balls.length; i++) {
      const a = balls[i];
      for (let j = i + 1; j < balls.length; j++) {
        const b = balls[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const minD = a.r + b.r;
        const d2 = dx * dx + dy * dy;
        if (d2 >= minD * minD) continue;
        const d = Math.sqrt(d2) || 1e-6;
        const nx = dx / d, ny = dy / d;
        const overlap = minD - d;
        const invA = 1 / a.m, invB = 1 / b.m, invSum = invA + invB;

        // Positional correction (split by inverse mass)
        a.x -= nx * overlap * (invA / invSum);
        a.y -= ny * overlap * (invA / invSum);
        b.x += nx * overlap * (invB / invSum);
        b.y += ny * overlap * (invB / invSum);

        // Impulse
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const jImp = -(1 + BALL_RESTITUTION) * vn / invSum;
          a.vx -= jImp * nx * invA; a.vy -= jImp * ny * invA;
          b.vx += jImp * nx * invB; b.vy += jImp * ny * invB;
        }
      }
    }

    // Wall collisions (convex polygon: test against each edge's supporting line)
    const apothem = R * Math.cos(Math.PI / 6);
    for (const b of balls) {
      for (let k = 0; k < 6; k++) {
        const ma = hexAngle + (k + 0.5) * Math.PI / 3; // edge midpoint direction
        const ux = Math.cos(ma), uy = Math.sin(ma);     // outward normal
        const relX = b.x - cx, relY = b.y - cy;
        const p = relX * ux + relY * uy;
        const limit = apothem - b.r;
        if (p <= limit) continue;

        // Push ball back inside
        const pen = p - limit;
        b.x -= ux * pen;
        b.y -= uy * pen;

        // Velocity of the wall at the contact point (rigid rotation: v = ω × r)
        const pcx = b.x + ux * b.r - cx;
        const pcy = b.y + uy * b.r - cy;
        const wvx = -omega * pcy;
        const wvy = omega * pcx;

        // Relative velocity in the wall's frame
        let rvx = b.vx - wvx, rvy = b.vy - wvy;
        const vn = rvx * ux + rvy * uy;
        if (vn > 0) {
          // Normal response
          const jn = (1 + e) * vn;
          rvx -= jn * ux;
          rvy -= jn * uy;

          // Tangential friction (Coulomb, clamped)
          const tx = -uy, ty = ux;
          const vt = rvx * tx + rvy * ty;
          const jt = Math.min(Math.abs(vt), FRICTION * jn) * Math.sign(vt);
          rvx -= jt * tx;
          rvy -= jt * ty;

          // Visual spin: nudge towards rolling speed
          const vtAfter = rvx * tx + rvy * ty;
          b.spin += (-vtAfter / b.r - b.spin) * 0.5;

          b.vx = rvx + wvx;
          b.vy = rvy + wvy;
        }
      }

      // Safety net: if a ball somehow escapes, put it back near the center.
      if (Math.hypot(b.x - cx, b.y - cy) > R * 1.2) {
        b.x = cx; b.y = cy; b.vx = 0; b.vy = 0;
      }
    }
  }

  // ---------- rendering ----------

  function hexPath(radius) {
    ctx.beginPath();
    for (let k = 0; k < 6; k++) {
      const a = hexAngle + k * Math.PI / 3;
      const x = cx + Math.cos(a) * radius;
      const y = cy + Math.sin(a) * radius;
      if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
  }

  function shade(hex, amt) {
    const n = parseInt(hex.slice(1), 16);
    let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
    if (amt >= 0) {
      r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt;
    } else {
      r *= 1 + amt; g *= 1 + amt; b *= 1 + amt;
    }
    return `rgb(${r | 0},${g | 0},${b | 0})`;
  }

  function draw() {
    // Background
    const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
    bg.addColorStop(0, '#182036');
    bg.addColorStop(1, '#080a12');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    const wallThickness = Math.max(4, R * 0.025);
    // Hexagon interior
    hexPath(R);
    const fill = ctx.createRadialGradient(cx, cy, 0, cx, cy, R);
    fill.addColorStop(0, 'rgba(70, 110, 200, 0.10)');
    fill.addColorStop(1, 'rgba(70, 110, 200, 0.22)');
    ctx.fillStyle = fill;
    ctx.fill();

    // Hexagon wall (drawn outside the collision boundary)
    ctx.save();
    ctx.lineJoin = 'round';
    ctx.shadowColor = 'rgba(100, 170, 255, 0.8)';
    ctx.shadowBlur = 22;
    ctx.strokeStyle = '#7fb4ff';
    ctx.lineWidth = wallThickness;
    hexPath(R + wallThickness / (2 * Math.cos(Math.PI / 6)));
    ctx.stroke();
    ctx.restore();

    // Vertex dots
    ctx.fillStyle = '#d6e6ff';
    for (let k = 0; k < 6; k++) {
      const a = hexAngle + k * Math.PI / 3;
      const rr = R + wallThickness / Math.cos(Math.PI / 6) * 0.5;
      ctx.beginPath();
      ctx.arc(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr, wallThickness * 0.7, 0, Math.PI * 2);
      ctx.fill();
    }

    // Balls
    for (const b of balls) {
      // Shadow
      ctx.beginPath();
      ctx.ellipse(b.x + b.r * 0.15, b.y + b.r * 0.25, b.r * 0.95, b.r * 0.9, 0, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(0,0,0,0.25)';
      ctx.fill();

      // Body
      const grad = ctx.createRadialGradient(
        b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.1,
        b.x, b.y, b.r
      );
      grad.addColorStop(0, shade(b.color, 0.55));
      grad.addColorStop(0.55, b.color);
      grad.addColorStop(1, shade(b.color, -0.45));
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fillStyle = grad;
      ctx.fill();

      // Rotating stripe to visualize spin
      ctx.save();
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.clip();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.rot);
      ctx.fillStyle = 'rgba(255,255,255,0.28)';
      ctx.fillRect(-b.r, -b.r * 0.14, b.r * 2, b.r * 0.28);
      ctx.restore();

      // Specular highlight
      ctx.beginPath();
      ctx.arc(b.x - b.r * 0.38, b.y - b.r * 0.38, b.r * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255,255,255,0.65)';
      ctx.fill();
    }
  }

  // ---------- loop ----------

  let last = performance.now();
  function frame(now) {
    let dt = (now - last) / 1000;
    last = now;
    if (dt > 1 / 30) dt = 1 / 30; // avoid huge jumps after tab switches
    if (!settings.paused) {
      const h = dt / SUBSTEPS;
      for (let i = 0; i < SUBSTEPS; i++) step(h);
    }
    draw();
    requestAnimationFrame(frame);
  }

  // ---------- UI ----------

  const $ = id => document.getElementById(id);
  function bindSlider(id, key, labelId, fmt) {
    const el = $(id), lab = $(labelId);
    const update = () => { settings[key] = parseFloat(el.value); lab.textContent = fmt(settings[key]); };
    el.addEventListener('input', update);
    update();
  }
  bindSlider('spin', 'spin', 'spinVal', v => `${v.toFixed(2)} rad/s`);
  bindSlider('grav', 'gravity', 'gravVal', v => v.toFixed(2));
  bindSlider('bounce', 'restitution', 'bounceVal', v => v.toFixed(2));

  const pauseBtn = $('pause');
  function togglePause() {
    settings.paused = !settings.paused;
    pauseBtn.textContent = settings.paused ? 'Play' : 'Pause';
  }
  pauseBtn.addEventListener('click', togglePause);
  $('reset').addEventListener('click', () => { hexAngle = 0; createBalls(); });

  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); togglePause(); }
    else if (e.key === 'r' || e.key === 'R') { hexAngle = 0; createBalls(); }
  });

  // Click: radial kick away from the click point
  canvas.addEventListener('pointerdown', e => {
    const mx = e.clientX, my = e.clientY;
    for (const b of balls) {
      const dx = b.x - mx, dy = b.y - my;
      const d = Math.hypot(dx, dy) || 1;
      const strength = R * 2.2 * Math.max(0, 1 - d / (R * 1.5));
      b.vx += (dx / d) * strength;
      b.vy += (dy / d) * strength;
    }
  });

  window.addEventListener('resize', resize);

  resize();
  createBalls();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
