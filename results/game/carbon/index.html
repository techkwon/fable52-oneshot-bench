<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Neon Orbit Dodge — Phaser 3</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at 50% 35%, #111827 0%, #070b14 75%);
      color: #cbd5e1;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      user-select: none;
    }

    #game-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    #game-container {
      width: 680px;
      height: 480px;
      border: 1px solid #1e293b;
      border-radius: 8px;
      overflow: hidden;
      box-shadow:
        0 18px 40px rgba(0, 0, 0, 0.75),
        0 0 24px rgba(59, 130, 246, 0.14);
      background-color: #0b1120;
    }

    #game-container canvas {
      display: block;
    }

    .instructions {
      width: 680px;
      background: rgba(15, 23, 42, 0.78);
      border: 1px solid #1e293b;
      border-radius: 8px;
      padding: 12px 18px;
      text-align: center;
      font-size: 13.5px;
      line-height: 1.6;
      color: #94a3b8;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
    }

    .instructions strong {
      color: #e2e8f0;
      font-weight: 600;
    }

    .key {
      display: inline-block;
      padding: 1px 6px;
      margin: 0 2px;
      font-size: 12px;
      font-weight: 600;
      color: #93c5fd;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 4px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .dot-blue {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #3b82f6;
      box-shadow: 0 0 8px #60a5fa;
      vertical-align: middle;
      margin-right: 4px;
    }

    .dot-red {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #ef4444;
      box-shadow: 0 0 8px #f87171;
      vertical-align: middle;
      margin-right: 4px;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body>
  <div id="game-wrapper">
    <div id="game-container"></div>
    <div class="instructions">
      <div>
        <span class="dot-blue"></span><strong>Move:</strong>
        <span class="key">W</span><span class="key">A</span><span class="key">S</span><span class="key">D</span>
        or
        <span class="key">&uarr;</span><span class="key">&larr;</span><span class="key">&darr;</span><span class="key">&rarr;</span>
        &nbsp;&bull;&nbsp;
        <span class="dot-red"></span><strong>Avoid</strong> chasing red circles
        &nbsp;&bull;&nbsp;
        <strong>Restart:</strong> <span class="key">R</span> (after Game Over)
      </div>
      <div>
        Survive for <strong>+1 score/sec</strong>. Both you and enemies <strong>wrap around screen edges</strong>, and enemies accelerate as your score climbs.
      </div>
    </div>
  </div>

  <script>
    (() => {
      const GAME_WIDTH = 680;
      const GAME_HEIGHT = 480;

      const PLAYER_RADIUS = 13;
      const PLAYER_SPEED = 235;

      const ENEMY_RADIUS = 11;
      const BASE_ENEMY_SPEED = 105;
      const SPEED_PER_SCORE = 3.6;
      const MAX_ENEMY_SPEED = 315;
      const MAX_ENEMIES = 18;

      const COLLISION_DIST = PLAYER_RADIUS + ENEMY_RADIUS - 2.5;

      let bestScoreMemory = 0;
      function getBestScore() {
        try {
          const saved = localStorage.getItem('phaser_blue_dodge_best');
          if (saved !== null) {
            bestScoreMemory = Math.max(bestScoreMemory, parseInt(saved, 10) || 0);
          }
        } catch (_) {}
        return bestScoreMemory;
      }

      function saveBestScore(score) {
        bestScoreMemory = Math.max(bestScoreMemory, score);
        try {
          localStorage.setItem('phaser_blue_dodge_best', String(bestScoreMemory));
        } catch (_) {}
      }

      class DodgeScene extends Phaser.Scene {
        constructor() {
          super({ key: 'DodgeScene' });
        }

        create() {
          this.ensureTextures();

          this.score = 0;
          this.bestScore = getBestScore();
          this.isGameOver = false;
          this.isRestarting = false;
          this.elapsedTime = 0;

          this.drawArenaBackground();

          // Player glow layers + core circle
          this.playerOuterGlow = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'playerGlow')
            .setBlendMode(Phaser.BlendModes.ADD)
            .setAlpha(0.65)
            .setDepth(4);

          this.playerPulseRing = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'playerRing')
            .setBlendMode(Phaser.BlendModes.ADD)
            .setAlpha(0.35)
            .setDepth(4);

          this.player = this.add.image(GAME_WIDTH / 2, GAME_HEIGHT / 2, 'playerCircle')
            .setDepth(5);
          this.player.vx = 0;
          this.player.vy = 0;

          // Subtle continuous glow/pulse animations on the player
          this.tweens.add({
            targets: this.playerOuterGlow,
            scale: { from: 0.88, to: 1.24 },
            alpha: { from: 0.42, to: 0.82 },
            duration: 950,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
          });

          this.tweens.add({
            targets: this.playerPulseRing,
            scale: { from: 0.85, to: 1.45 },
            alpha: { from: 0.45, to: 0.05 },
            duration: 1350,
            repeat: -1,
            ease: 'Cubic.easeOut'
          });

          this.tweens.add({
            targets: this.player,
            scale: { from: 0.97, to: 1.05 },
            duration: 950,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
          });

          // Enemy storage
          this.enemies = [];

          // Input setup (WASD + Arrow keys + R)
          this.cursors = this.input.keyboard.createCursorKeys();
          this.wasd = this.input.keyboard.addKeys({
            up: Phaser.Input.Keyboard.KeyCodes.W,
            down: Phaser.Input.Keyboard.KeyCodes.S,
            left: Phaser.Input.Keyboard.KeyCodes.A,
            right: Phaser.Input.Keyboard.KeyCodes.D
          });
          this.rKey = this.input.keyboard.addKey(Phaser.Input.Keyboard.KeyCodes.R);

          const onRestartKey = (event) => {
            if (
              this.isGameOver &&
              (event.key === 'r' || event.key === 'R' || event.code === 'KeyR' || event.keyCode === 82)
            ) {
              this.restartGame();
            }
          };
          this.input.keyboard.on('keydown', onRestartKey);
          this.events.once(Phaser.Scenes.Events.SHUTDOWN, () => {
            this.input.keyboard.off('keydown', onRestartKey);
          });

          this.input.keyboard.addCapture([
            Phaser.Input.Keyboard.KeyCodes.UP,
            Phaser.Input.Keyboard.KeyCodes.DOWN,
            Phaser.Input.Keyboard.KeyCodes.LEFT,
            Phaser.Input.Keyboard.KeyCodes.RIGHT,
            Phaser.Input.Keyboard.KeyCodes.SPACE
          ]);

          // HUD
          this.scoreText = this.add.text(16, 14, 'SCORE: 0', {
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '18px',
            fontStyle: 'bold',
            color: '#f8fafc'
          }).setDepth(20);

          this.bestText = this.add.text(16, 38, `BEST: ${this.bestScore}`, {
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '13px',
            color: '#64748b'
          }).setDepth(20);

          this.speedText = this.add.text(GAME_WIDTH - 16, 16, 'ENEMY SPEED: 1.00x', {
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '13px',
            color: '#f87171'
          }).setOrigin(1, 0).setDepth(20);

          // Spawn first enemy right away from a screen edge
          this.spawnEnemy();

          // Score increments by 1 every second
          this.scoreTimer = this.time.addEvent({
            delay: 1000,
            loop: true,
            callback: () => {
              if (this.isGameOver) return;
              this.score += 1;
              if (this.score > this.bestScore) {
                this.bestScore = this.score;
                saveBestScore(this.bestScore);
              }
              this.updateHud();
            }
          });

          // Spawn additional enemies periodically from screen edges
          this.scheduleNextSpawn();
        }

        ensureTextures() {
          // Player circle texture
          if (!this.textures.exists('playerCircle')) {
            const size = 36;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2;
            const cy = size / 2;

            const grad = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, PLAYER_RADIUS);
            grad.addColorStop(0, '#bae6fd');
            grad.addColorStop(0.45, '#3b82f6');
            grad.addColorStop(1, '#1d4ed8');

            ctx.beginPath();
            ctx.arc(cx, cy, PLAYER_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.lineWidth = 1.5;
            ctx.strokeStyle = '#93c5fd';
            ctx.stroke();

            this.textures.addCanvas('playerCircle', canvas);
          }

          // Soft blue glow texture
          if (!this.textures.exists('playerGlow')) {
            const size = 96;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const c = size / 2;

            const grad = ctx.createRadialGradient(c, c, 4, c, c, c);
            grad.addColorStop(0, 'rgba(96, 165, 250, 0.75)');
            grad.addColorStop(0.35, 'rgba(59, 130, 246, 0.32)');
            grad.addColorStop(0.7, 'rgba(37, 99, 235, 0.08)');
            grad.addColorStop(1, 'rgba(37, 99, 235, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            this.textures.addCanvas('playerGlow', canvas);
          }

          // Subtle expanding pulse ring texture
          if (!this.textures.exists('playerRing')) {
            const size = 68;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const c = size / 2;

            ctx.beginPath();
            ctx.arc(c, c, PLAYER_RADIUS + 6, 0, Math.PI * 2);
            ctx.lineWidth = 2;
            ctx.strokeStyle = 'rgba(147, 197, 253, 0.65)';
            ctx.stroke();

            this.textures.addCanvas('playerRing', canvas);
          }

          // Enemy red circle texture
          if (!this.textures.exists('enemyCircle')) {
            const size = 32;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const cx = size / 2;
            const cy = size / 2;

            const grad = ctx.createRadialGradient(cx - 2.5, cy - 2.5, 1.5, cx, cy, ENEMY_RADIUS);
            grad.addColorStop(0, '#fca5a5');
            grad.addColorStop(0.5, '#ef4444');
            grad.addColorStop(1, '#991b1b');

            ctx.beginPath();
            ctx.arc(cx, cy, ENEMY_RADIUS, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            ctx.lineWidth = 1.4;
            ctx.strokeStyle = '#f87171';
            ctx.stroke();

            this.textures.addCanvas('enemyCircle', canvas);
          }

          // Enemy subtle glow texture
          if (!this.textures.exists('enemyGlow')) {
            const size = 64;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            const c = size / 2;

            const grad = ctx.createRadialGradient(c, c, 2, c, c, c);
            grad.addColorStop(0, 'rgba(248, 113, 113, 0.5)');
            grad.addColorStop(0.45, 'rgba(239, 68, 68, 0.16)');
            grad.addColorStop(1, 'rgba(239, 68, 68, 0)');

            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, size, size);
            this.textures.addCanvas('enemyGlow', canvas);
          }

          // Particle dot texture
          if (!this.textures.exists('sparkDot')) {
            const size = 10;
            const canvas = document.createElement('canvas');
            canvas.width = size;
            canvas.height = size;
            const ctx = canvas.getContext('2d');
            ctx.beginPath();
            ctx.arc(size / 2, size / 2, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            this.textures.addCanvas('sparkDot', canvas);
          }
        }

        drawArenaBackground() {
          const g = this.add.graphics().setDepth(0);

          // Subtle grid for clear motion & edge-wrap reference
          g.lineStyle(1, 0x1e293b, 0.45);
          const step = 40;
          for (let x = step; x < GAME_WIDTH; x += step) {
            g.lineBetween(x, 0, x, GAME_HEIGHT);
          }
          for (let y = step; y < GAME_HEIGHT; y += step) {
            g.lineBetween(0, y, GAME_WIDTH, y);
          }

          // Subtle wrap-portal border accent along edges
          g.lineStyle(2, 0x1e3a8a, 0.35);
          g.strokeRect(1, 1, GAME_WIDTH - 2, GAME_HEIGHT - 2);
        }

        getCurrentEnemySpeed() {
          return Math.min(MAX_ENEMY_SPEED, BASE_ENEMY_SPEED + this.score * SPEED_PER_SCORE);
        }

        updateHud() {
          this.scoreText.setText(`SCORE: ${this.score}`);
          this.bestText.setText(`BEST: ${this.bestScore}`);
          const mult = (this.getCurrentEnemySpeed() / BASE_ENEMY_SPEED).toFixed(2);
          this.speedText.setText(`ENEMY SPEED: ${mult}x`);
        }

        scheduleNextSpawn() {
          if (this.isGameOver) return;
          const nextDelay = Math.max(1750, 3400 - this.score * 45);
          this.spawnTimer = this.time.delayedCall(nextDelay, () => {
            if (this.isGameOver) return;
            if (this.enemies.length < MAX_ENEMIES) {
              this.spawnEnemy();
            }
            this.scheduleNextSpawn();
          });
        }

        getWrappedDelta(fromX, fromY, toX, toY) {
          let dx = toX - fromX;
          let dy = toY - fromY;
          if (dx > GAME_WIDTH / 2) dx -= GAME_WIDTH;
          else if (dx < -GAME_WIDTH / 2) dx += GAME_WIDTH;

          if (dy > GAME_HEIGHT / 2) dy -= GAME_HEIGHT;
          else if (dy < -GAME_HEIGHT / 2) dy += GAME_HEIGHT;

          return { dx, dy };
        }

        spawnEnemy() {
          let x = 0;
          let y = 0;

          // Pick a spot strictly on one of the 4 screen edges at a safe distance from the player
          for (let attempt = 0; attempt < 20; attempt++) {
            const edge = Phaser.Math.Between(0, 3);
            if (edge === 0) {
              // Top edge
              x = Phaser.Math.FloatBetween(8, GAME_WIDTH - 8);
              y = 2;
            } else if (edge === 1) {
              // Bottom edge
              x = Phaser.Math.FloatBetween(8, GAME_WIDTH - 8);
              y = GAME_HEIGHT - 2;
            } else if (edge === 2) {
              // Left edge
              x = 2;
              y = Phaser.Math.FloatBetween(8, GAME_HEIGHT - 8);
            } else {
              // Right edge
              x = GAME_WIDTH - 2;
              y = Phaser.Math.FloatBetween(8, GAME_HEIGHT - 8);
            }

            const { dx, dy } = this.getWrappedDelta(x, y, this.player.x, this.player.y);
            if (Math.hypot(dx, dy) >= 190) {
              break;
            }
          }

          const glow = this.add.image(x, y, 'enemyGlow')
            .setBlendMode(Phaser.BlendModes.ADD)
            .setAlpha(0.7)
            .setDepth(2);

          const sprite = this.add.image(x, y, 'enemyCircle')
            .setScale(0.3)
            .setDepth(3);

          this.tweens.add({
            targets: sprite,
            scale: 1,
            duration: 220,
            ease: 'Back.easeOut'
          });

          // Initial velocity aimed toward player
          const { dx, dy } = this.getWrappedDelta(x, y, this.player.x, this.player.y);
          const dist = Math.hypot(dx, dy) || 1;
          const speed = this.getCurrentEnemySpeed();
          const speedFactor = Phaser.Math.FloatBetween(0.94, 1.06);

          this.enemies.push({
            sprite,
            glow,
            vx: (dx / dist) * speed * speedFactor,
            vy: (dy / dist) * speed * speedFactor,
            speedFactor,
            turnRate: Phaser.Math.FloatBetween(3.1, 4.2)
          });
        }

        wrapCoordinates(entity) {
          if (entity.x < 0) entity.x += GAME_WIDTH;
          else if (entity.x > GAME_WIDTH) entity.x -= GAME_WIDTH;

          if (entity.y < 0) entity.y += GAME_HEIGHT;
          else if (entity.y > GAME_HEIGHT) entity.y -= GAME_HEIGHT;
        }

        triggerGameOver() {
          if (this.isGameOver) return;
          this.isGameOver = true;

          if (this.scoreTimer) this.scoreTimer.remove(false);
          if (this.spawnTimer) this.spawnTimer.remove(false);

          saveBestScore(this.score);
          this.bestScore = getBestScore();
          this.updateHud();

          this.cameras.main.shake(180, 0.009);

          // Collision particle burst
          for (let i = 0; i < 22; i++) {
            const angle = (Math.PI * 2 * i) / 22 + Phaser.Math.FloatBetween(-0.12, 0.12);
            const spd = Phaser.Math.FloatBetween(55, 190);
            const color = i % 2 === 0 ? 0x60a5fa : 0xf87171;
            const dot = this.add.image(this.player.x, this.player.y, 'sparkDot')
              .setTint(color)
              .setBlendMode(Phaser.BlendModes.ADD)
              .setScale(Phaser.Math.FloatBetween(0.5, 1.1))
              .setDepth(15);

            this.tweens.add({
              targets: dot,
              x: dot.x + Math.cos(angle) * spd * 0.45,
              y: dot.y + Math.sin(angle) * spd * 0.45,
              alpha: 0,
              scale: 0.1,
              duration: Phaser.Math.Between(360, 620),
              ease: 'Cubic.easeOut',
              onComplete: () => dot.destroy()
            });
          }

          this.player.setAlpha(0.35);
          this.playerOuterGlow.setAlpha(0.15);

          // Game Over dark overlay
          const overlay = this.add.rectangle(
            GAME_WIDTH / 2,
            GAME_HEIGHT / 2,
            GAME_WIDTH,
            GAME_HEIGHT,
            0x060913,
            0.76
          ).setDepth(30);
          overlay.setAlpha(0);
          this.tweens.add({
            targets: overlay,
            alpha: 1,
            duration: 220
          });

          const panel = this.add.graphics().setDepth(31);
          panel.fillStyle(0x0f172a, 0.94);
          panel.lineStyle(1.5, 0x334155, 0.9);
          panel.fillRoundedRect(GAME_WIDTH / 2 - 170, GAME_HEIGHT / 2 - 105, 340, 210, 12);
          panel.strokeRoundedRect(GAME_WIDTH / 2 - 170, GAME_HEIGHT / 2 - 105, 340, 210, 12);

          this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 58, 'GAME OVER', {
            fontFamily: 'system-ui, -apple-system, sans-serif',
            fontSize: '34px',
            fontStyle: '800',
            color: '#f87171'
          }).setOrigin(0.5).setDepth(32);

          this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 - 6, `Score: ${this.score}`, {
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '22px',
            fontStyle: 'bold',
            color: '#f8fafc'
          }).setOrigin(0.5).setDepth(32);

          this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 26, `Best: ${this.bestScore}`, {
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '14px',
            color: '#94a3b8'
          }).setOrigin(0.5).setDepth(32);

          const restartPrompt = this.add.text(GAME_WIDTH / 2, GAME_HEIGHT / 2 + 68, 'Press R to Restart', {
            fontFamily: 'ui-monospace, SFMono-Regular, Menlo, Consolas, monospace',
            fontSize: '16px',
            fontStyle: 'bold',
            color: '#60a5fa'
          }).setOrigin(0.5).setDepth(32);

          this.tweens.add({
            targets: restartPrompt,
            alpha: { from: 1, to: 0.35 },
            duration: 650,
            yoyo: true,
            repeat: -1,
            ease: 'Sine.easeInOut'
          });
        }

        restartGame() {
          if (this.isRestarting) return;
          this.isRestarting = true;
          this.scene.restart();
        }

        update(_time, delta) {
          if (this.isGameOver) {
            if (Phaser.Input.Keyboard.JustDown(this.rKey)) {
              this.restartGame();
            }
            return;
          }

          const dt = Math.min(delta / 1000, 0.05);

          // 1. Player movement (WASD + Arrow keys)
          let moveX = 0;
          let moveY = 0;

          if (this.cursors.left.isDown || this.wasd.left.isDown) moveX -= 1;
          if (this.cursors.right.isDown || this.wasd.right.isDown) moveX += 1;
          if (this.cursors.up.isDown || this.wasd.up.isDown) moveY -= 1;
          if (this.cursors.down.isDown || this.wasd.down.isDown) moveY += 1;

          if (moveX !== 0 || moveY !== 0) {
            const len = Math.hypot(moveX, moveY);
            this.player.vx = (moveX / len) * PLAYER_SPEED;
            this.player.vy = (moveY / len) * PLAYER_SPEED;
          } else {
            this.player.vx = 0;
            this.player.vy = 0;
          }

          this.player.x += this.player.vx * dt;
          this.player.y += this.player.vy * dt;

          // Wrap player around screen edges
          this.wrapCoordinates(this.player);

          // Sync player glow & pulse ring positions
          this.playerOuterGlow.setPosition(this.player.x, this.player.y);
          this.playerPulseRing.setPosition(this.player.x, this.player.y);

          // 2. Update enemies: Seek AI + speed scaling + screen wrapping + collision
          const baseSpeed = this.getCurrentEnemySpeed();
          const turnBoost = 1 + this.score * 0.012;

          for (let i = 0; i < this.enemies.length; i++) {
            const enemy = this.enemies[i];
            const targetSpeed = baseSpeed * enemy.speedFactor;

            // Seek vector toward player (direct Euclidean chase so enemies naturally pursue & cross edges via momentum or toroidal wrap)
            const { dx, dy } = this.getWrappedDelta(
              enemy.sprite.x,
              enemy.sprite.y,
              this.player.x,
              this.player.y
            );
            const distToPlayer = Math.hypot(dx, dy) || 0.0001;

            let desiredVx = (dx / distToPlayer) * targetSpeed;
            let desiredVy = (dy / distToPlayer) * targetSpeed;

            // Gentle separation between enemies so red circles stay distinct instead of stacking into one
            let sepX = 0;
            let sepY = 0;
            for (let j = 0; j < this.enemies.length; j++) {
              if (i === j) continue;
              const other = this.enemies[j];
              const sDelta = this.getWrappedDelta(
                other.sprite.x,
                other.sprite.y,
                enemy.sprite.x,
                enemy.sprite.y
              );
              const sDist = Math.hypot(sDelta.dx, sDelta.dy);
              if (sDist > 0 && sDist < ENEMY_RADIUS * 2.5) {
                const push = (ENEMY_RADIUS * 2.5 - sDist) / (ENEMY_RADIUS * 2.5);
                sepX += (sDelta.dx / sDist) * push * 55;
                sepY += (sDelta.dy / sDist) * push * 55;
              }
            }

            desiredVx += sepX;
            desiredVy += sepY;

            // Smooth steering (classic Reynolds seek behavior)
            const steerFactor = Math.min(1, enemy.turnRate * turnBoost * dt);
            enemy.vx += (desiredVx - enemy.vx) * steerFactor;
            enemy.vy += (desiredVy - enemy.vy) * steerFactor;

            // Normalize to targetSpeed so enemies consistently move at current scaled speed
            const curSpd = Math.hypot(enemy.vx, enemy.vy) || 1;
            enemy.vx = (enemy.vx / curSpd) * targetSpeed;
            enemy.vy = (enemy.vy / curSpd) * targetSpeed;

            enemy.sprite.x += enemy.vx * dt;
            enemy.sprite.y += enemy.vy * dt;

            // Wrap enemy around screen edges
            this.wrapCoordinates(enemy.sprite);
            enemy.glow.setPosition(enemy.sprite.x, enemy.sprite.y);

            // Check collision with player (wrap-aware distance)
            const colDelta = this.getWrappedDelta(
              enemy.sprite.x,
              enemy.sprite.y,
              this.player.x,
              this.player.y
            );
            if (Math.hypot(colDelta.dx, colDelta.dy) < COLLISION_DIST) {
              this.triggerGameOver();
              return;
            }
          }
        }
      }

      const config = {
        type: Phaser.AUTO,
        width: GAME_WIDTH,
        height: GAME_HEIGHT,
        parent: 'game-container',
        backgroundColor: '#0b1120',
        scene: [DodgeScene]
      };

      new Phaser.Game(config);
    })();
  </script>
</body>
</html>
